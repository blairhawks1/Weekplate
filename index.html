/* ================= meal photos ================= */
/* Photos are compressed hard: storage is a few MB total, so we downscale to ~400px JPEG. */
function fileToImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=()=>rej(new Error('bad image')); img.src=r.result; };
    r.onerror=()=>rej(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
async function compressPhoto(file, maxDim, quality){
  maxDim=maxDim||400; quality=quality||0.62;
  const img=await fileToImage(file);
  let {width:w, height:h}=img;
  const scale=Math.min(1, maxDim/Math.max(w,h));
  w=Math.round(w*scale); h=Math.round(h*scale);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg', quality);
}
function photoBytes(){

/* ================= what can I make right now ================= */
/* Scores every recipe against what's actually in the pantry. */
function pantryHave(name){
  const p=(S.pantry||[]).find(x=>normName(x.name)===normName(name));
  return p? p.qty : 0;
}
// staples most kitchens have; not counted as "missing"
const ASSUMED = ['olive oil','butter','soy sauce','honey','brown sugar','cornstarch','mayonnaise',
  'ketchup','dijon mustard','hot sauce','worcestershire sauce','balsamic vinegar','rice vinegar','sesame oil',
  'taco seasoning','chili powder','curry powder','ground cumin','smoked paprika','italian seasoning',
  'dried oregano','cajun seasoning','garlic','onion'];
function makeNowMatches(servings){
  const scale=(servings||targetServings())/4;
  const avoid=avoidList();
  const restricted=S.household.filter(p=>(p.diet||[]).length);
  const out=[];
  RECIPES.forEach(src=>{
    if((S.blocked||[]).includes(src.t)) return;
    if(!passesAvoid(src,avoid)) return;
    // must be safe for everyone — no alternates when you're cooking on the fly
    if(restricted.some(p=>violatesPerson(src,p))) return;
    const need=[], missing=[], assumed=[];
    src.ing.forEach(([nm,q,u])=>{
      const want=round2(q*scale);
      const have=pantryHave(nm);
      if(have>=want-0.001) need.push({name:nm,want,have,unit:u});
      else if(ASSUMED.includes(nm)) assumed.push({name:nm,want,have,unit:u});
      else missing.push({name:nm, short:round2(want-have), unit:u, partial:have>0});
    });
    const total=src.ing.length;
    const haveCount=need.length;
    out.push({src, have:haveCount, total, missing, assumed,
      pct: total? haveCount/total : 0,
      cost: missing.reduce((s,m)=>{ const per=unitPriceOf(m.name); return s + (per!=null? per*m.short : 0); },0)});
  });
  out.sort((a,b)=> a.missing.length - b.missing.length || b.pct - a.pct || a.src.m - b.src.m);
  return out;
}
function openMakeNow(){
  makeNowServings = targetServings();
  renderMakeNow();
  $('#sheet').classList.add('show'); $('#sheet').scrollTop=0;
}
let makeNowServings=4, makeNowFilter=0;   // 0 = all, 1 = zero missing, 2 = <=2 missing

  let show = makeNowFilter===1? ready : makeNowFilter===2? close : all.slice(0,30);

  const card=m=>{

        ${m.assumed.length? `<div class="qty" style="margin-top:4px">Assumes you have: ${m.assumed.map(x=>esc(x.name)).join(', ')}</div>`:''}
        <div class="row" style="gap:8px;margin-top:8px">

  };
  $('#sheet').innerHTML = `<div class="sheet-in">

    <div class="row" style="margin:10px 0">
      <span class="sub" style="margin:0">Servings</span>
      <div class="stepper mini">
        <button onclick="makeNowServings=Math.max(1,makeNowServings-1);renderMakeNow()">−</button>
        <span class="val">${makeNowServings}</span>
        <button onclick="makeNowServings=Math.min(12,makeNowServings+1);renderMakeNow()">+</button>
      </div>
    </div>
    <div class="seg" style="margin-bottom:10px">
      ${[[0,'All'],[1,`Ready (${ready.length})`],[2,`Almost (${close.length})`]].map(([k,l])=>
        `<button class="${makeNowFilter===k?'on':''}" onclick="makeNowFilter=${k};renderMakeNow()">${l}</button>`).join('')}
    </div>
    ${!(S.pantry||[]).length? `<div class="err">Your pantry is empty, so nothing scores well. Finish a week (leftovers roll in automatically) or add items in the Pantry tab.</div>`:''}
    ${show.length? show.map(card).join('') : `<div class="empty"><p>Nothing matches.</p></div>`}
  </div>`;

async function cookNow(title){
  const src=RECIPES.find(r=>r.t===title); if(!src) return;
  const scale=makeNowServings/4;

  let used=0;
  src.ing.forEach(([nm,q,u])=>{

    const pi=(S.pantry||[]).find(x=>normName(x.name)===normName(nm) && x.unit===u);
    if(pi){ pi.qty=round2(pi.qty-Math.min(pi.qty,want)); used++; }
  });
  S.pantry=(S.pantry||[]).filter(p=>p.qty>0.01);

function renderNav(){
  const tabs = [['plan','Plan'],['list','Shopping'],['pantry','Pantry'],['setup','Setup'],['help','Guide']];
  $('#nav').innerHTML = tabs.map(([k,l])=>
    `<button class="${tab===k?'on':''}" ${tab===k?'aria-current="page"':''} aria-label="${l}" onclick="tab='${k}';render();document.getElementById('main').focus()">${ICONS[k]}<span>${l}</span><span class="dot"></span></button>`).join('');
}

function render(){
  renderNav();
  $('#weekLabel').textContent = S.week ? `Week of ${S.week.weekOf} · ${S.week.servings} servings/dinner` : `${targetServings()} servings per dinner`;
  const m = $('#main');
  if(tab==='plan') m.innerHTML = viewPlan();
  else if(tab==='list') m.innerHTML = viewList();
  else if(tab==='pantry') m.innerHTML = viewPantry();
  else if(tab==='help') m.innerHTML = viewHelp();
  else m.innerHTML = viewSetup();
  if(tab==='setup') bindSetup();
}

/* ----- plan ----- */
function viewPlan(){
  let h = '';
  if(lastErr){ h += `<div class="err"><b>Couldn't finish planning:</b> ${esc(lastErr)}<br>Tap the button to retry — it resumes from scratch and falls back to offline estimates if search is blocked.</div>`; lastErr=null; }
  if(!S.week){
    h += `<section class="homehero" aria-labelledby="homeTitle">
      <img src="icons/home-hero.jpg" alt="Lemon chicken, roasted vegetables, and a colorful grain bowl ready for the week">
      <div class="homecopy">
        <h2 id="homeTitle">Dinner decisions, handled.</h2>
        <p>Build a family-ready ${S.horizon>1?'two-week':'weekly'} plan, a priced shopping list, and a smarter pantry in one tap.</p>
        <button class="btn" onclick="generateWeek()">Build my ${S.horizon>1?'2-week':'weekly'} plan</button>
      </div>
    </section>
    <div class="homestats" aria-label="WeekPlate highlights">
      <div class="homestat"><b>${RECIPES.length}</b><span>tested dinners</span></div>
      <div class="homestat"><b>${S.dinners*(S.horizon||1)}</b><span>nights planned</span></div>
      <div class="homestat"><b>On-device</b><span>private by design</span></div>
    </div>
    <div class="card">
      <div class="row"><div><h2>Your plan, at a glance</h2><p class="sub" style="margin:3px 0 0">≤ ${S.maxMinutes} min · ${targetServings()} servings${S.pantry.length? ` · ${S.pantry.length} pantry item${S.pantry.length>1?'s':''} prioritized`:''}</p></div><span class="pill leaf">Ready</span></div>
      ${dietSummaryTxt()? `<p class="sub" style="margin:10px 0 0"><b>Cooking for:</b> ${dietSummaryTxt()}</p>`:''}
      <div class="howgrid">
        <div class="howstep"><i>1</i><b>Plan</b><span>Matches time, diets, budget, and favorites.</span></div>
        <div class="howstep"><i>2</i><b>Shop</b><span>Compares Walmart and Aldi by aisle.</span></div>
        <div class="howstep"><i>3</i><b>Waste less</b><span>Uses pantry food before its use-by date.</span></div>
      </div>
      <div class="homesetup"><button onclick="tab='setup';render();document.getElementById('main').focus()">Adjust household and planning settings</button></div>
    </div>`;
    return h;
  }
  const w = S.week;
  if(w.shared) h += `<div class="card carry"><h2>📲 Shared plan</h2>
    <p class="sub" style="margin:6px 0 0">${w.sharedFrom? esc(w.sharedFrom)+' sent you this week.':'This week was shared with you.'} Cook it, shop it, check items off — it's yours now. Check-offs stay on this phone.</p></div>`;
  if(!w.planApproved){
    h += `<div class="card reviewbar"><h2>Review your plan</h2><p class="sub">Make it feel right before shopping. Swap anything, lock the keepers, or remove a dinner—then approve the week.</p>
      <div class="reviewactions"><button class="btn ghost" onclick="libReshuffle()">Reshuffle</button><button class="btn" style="background:var(--squash);color:#2B241A" onclick="approvePlan()">Approve plan</button></div></div>`;
  } else {
    h += `<div class="card reviewbar done"><div class="row"><div><h2>✓ Plan approved</h2><p class="sub">Your shopping list is ready.</p></div><button class="chip" onclick="S.week.planApproved=false;save();render()">Edit plan</button></div></div>`;
  }
  const calCost = r=>{ const src=RECIPES.find(x=>x.t===r.title); return src?recipeCost4(src)*((r.servings||w.servings)/4):0; };
  let calWeek=0;
  h += `<section aria-labelledby="calendarTitle"><div class="row"><h2 id="calendarTitle" style="font-size:18px;margin:4px 2px">Your dinner calendar</h2><span class="pill leaf">${w.recipes.reduce((n,r)=>n+(r.double?2:1),0)} nights</span></div><div class="plancal">`;
  w.recipes.forEach((r,i)=>{
    const rw=r.week||1;
    if((w.horizon||1)>1 && rw!==calWeek){ calWeek=rw; h+=`<div class="calweek">Week ${rw}</div>`; }
    const mins=(r.prepMin||0)+(r.cookMin||0);
    h += `<button class="calday" onclick="document.getElementById('meal${i}').scrollIntoView({behavior:'smooth',block:'start'})"><span class="cd">${esc(r.day)}${r.locked?' · 🔒':''}</span><span class="ct">${esc(r.title)}</span><span class="cm"><span>${mins} min</span><span>≈${money(calCost(r))}</span>${r.double?'<span>Cook ×2</span>':''}</span></button>`;
    if(r.leftoverDay) h += `<button class="calday leftover" onclick="document.getElementById('meal${i}').scrollIntoView({behavior:'smooth',block:'start'})"><span class="cd">${esc(r.leftoverDay)}</span><span class="ct">Leftovers · ${esc(r.title)}</span><span class="cm"><span>No cooking</span><span>Already covered</span></span></button>`;
  });
  h += `</div></section>`;
  let lastWk = 0;
  h += w.recipes.map((r,i)=>{
    let divider = '';
    if((w.horizon||1)>1 && (r.week||1)!==lastWk){
      lastWk = r.week||1;
      divider = `<div class="wkdiv"><span>Week ${lastWk}</span></div>`;
    }
    const uses = (w.shopping.filter(it=> it.fromPantry>0 && it.usedBy.includes(r.day)).map(it=>it.name));
    const rph = photoOf(r.title);
    return divider + `<div class="card recipe" id="meal${i}">
      ${rph? `<img class="cardphoto" src="${rph.src}" alt="">`:''}
      <div class="top">
        <div class="day">${r.day}${r.double?' · COOK ×2':''}${r.locked?' · 🔒 locked':''}${(r.servings&&r.servings!==S.week.servings&&!r.double)?` · ${r.servings} servings`:''}</div>
        <h3>${esc(r.title)} <button class="favbtn" onclick="toggleFav('${esc(r.title).replace(/'/g,"\\'")}')">${(S.favorites||[]).includes(r.title)?'♥':'♡'}</button></h3>
        <p class="sub" style="margin:0">${esc(r.summary||'')}</p>
        <div class="meta">
          <span class="pill sq">⏱ ${(r.prepMin||0)+(r.cookMin||0)} min total</span>
          <span class="pill leaf">${(r.ingredients||[]).length} ingredients</span>
          ${(()=>{const nu=recipeNutrition(r); return nu.cal? `<span class="pill est">≈${nu.cal} cal · ${nu.protein}P / ${nu.carbs}C / ${nu.fat}F</span>`:'';})()}
        </div>
      </div>
      ${uses.length? `<div class="usesbar">♻️ Uses from pantry: ${uses.map(esc).join(', ')}</div>`:''}
      ${(r.offFor&&r.offFor.length)? `<div class="usesbar alt">🍽 ${r.offFor.map(esc).join(' & ')} eats their own meal tonight (see Alternates below)</div>`:''}
      <ul class="ing-list" id="ing${i}">
        ${(r.ingredients||[]).map(x=>`<li><span class="q mono">${round2(x.qty)} ${esc(x.unit)}</span> ${esc(x.name)}</li>`).join('')}
      </ul>
      <div class="servrow">
        <span>Servings for this dinner</span>
        <div class="stepper mini">
          <button onclick="setMealServings(${i},-1)">−</button>
          <span class="val">${r.servings||S.week.servings}</span>
          <button onclick="setMealServings(${i},1)">+</button>
        </div>
      </div>
      <div class="foot">
        <button onclick="document.getElementById('ing${i}').classList.toggle('open')">Ingredients</button>
        ${r.steps&&r.steps.length? `<button onclick="openRecipe(${i})"><b>Full recipe</b></button>`
          : r.url? `<button onclick="window.open('${esc(r.url)}','_blank')">Recipe ↗</button>`:''}
        <button onclick="toggleLock(${i})" aria-label="Lock">${r.locked?'🔒':'🔓'}</button>
        <button onclick="swapRecipe(${i})">Swap</button>
        <button onclick="removeMeal(${i})" aria-label="Remove dinner">Remove</button>
      </div>
    </div>`;
  }).join('');
  if((w.horizon||1)>1){
    const shared = w.shopping.filter(it=>{
      const wks = new Set(); w.recipes.forEach(r=>{ if((r.ingredients||[]).some(x=>normName(x.name)===normName(it.name))) wks.add(r.week||1); });
      return wks.size>1;
    });
    h += `<div class="card carry"><h2>🛒 One shop, two weeks</h2>
      <p class="sub" style="margin:6px 0 0">This list covers all ${w.recipes.reduce((s,r)=>s+(r.double?2:1),0)} dinners.${shared.length? ` ${shared.length} bulk item${shared.length>1?'s':''} get used across both weeks: ${shared.slice(0,5).map(it=>esc(it.name)).join(', ')}${shared.length>5?'…':''}` : ''}</p></div>`;
  }
  h += `<button class="btn ghost" style="margin-top:14px" onclick="sharePlanLink()">📲 Send this plan to another phone</button>`;
  h += `<button class="btn ghost" style="margin-top:10px" onclick="makePDF()">🖨 Print ${((w.horizon||1)>1)?'2 weeks':'week'} to PDF</button>
        <button class="btn ghost" style="margin-top:10px" onclick="exportForPDF()">📋 Get PDF via Claude chat</button>`;
  if(w.mode==='lib') h += `<button class="btn ghost" style="margin-top:10px" onclick="libReshuffle()">↻ Reshuffle unlocked dinners</button>`;
  h += `<button class="btn warn" style="margin-top:10px" onclick="finishWeek()">✓ Finish ${((w.horizon||1)>1)?'both weeks':'week'} — save leftovers to pantry</button>
        <button class="btn ghost" style="margin-top:10px" onclick="if(confirm('Discard this plan?')){S.week=null;save();render();}">Discard plan</button>`;
  return h;
}

function setMealServings(i, delta){
  const r=S.week.recipes[i]; const cur=r.servings||S.week.servings;
  const next=Math.max(1, Math.min(12, cur+delta));
  rescaleRecipe(r, next);
  rebuildWeekShopping(); S.week.planApproved=false;
  save(); render();
}
function rebuildWeekShopping(){
  if(!S.week) return;
  S.week.shopping=consolidate(S.week.recipes.concat((S.week.alts||[]).map(a=>a.rec)));
  libPrice(S.week.shopping);
}
function approvePlan(){
  if(!S.week || !S.week.recipes.length){ toast('Add at least one dinner first'); return; }
  S.week.planApproved=true; save(); render(); toast('Plan approved — shopping list ready');
}
function removeMeal(i){
  if(!S.week || !S.week.recipes[i]) return;
  const meal=S.week.recipes[i];
  if(!confirm(`Remove ${meal.title} from this plan?`)) return;
  S.week.recipes.splice(i,1);
  rebuildWeekShopping(); S.week.planApproved=false; save(); render();
  toast('Dinner removed');
}
function rerunWeek(hi){
  const wk=S.history[hi]; if(!wk) return;
  const scale=(wk.servings||targetServings())/4;
  const recipes = wk.titles.map((t,i)=>{ const src=RECIPES.find(x=>x.t===t); return src? libRecipeObj(src, DAYS[i], scale):null; }).filter(Boolean);
  if(!recipes.length){ toast('Could not rebuild that week'); return; }
  finalizeWeek(recipes, new Date().toISOString().slice(0,10), false);
  tab='plan'; render(); toast('Loaded past week as this week');
}

async function swapRecipe(i){
  if(!S.week) return;
  if(S.week.recipes[i].locked){ toast('Unlock this dinner first'); return; }
  if(S.week.mode==='lib'){ libSwap(i); return; }
  cancelled=false; $('#progress').classList.add('show');
  prog(30, `Finding a different ${S.week.recipes[i].day} dinner…`,'');
  const tgt = S.week.servings;
  const others = S.week.recipes.filter((_,x)=>x!==i).map(r=>r.title).join('; ');
  const perP = S.household.filter(p=>(p.diet||[]).length).map((p)=>`${personLabel(p,S.household.indexOf(p))}: ${p.diet.join(', ')}`).join('; ');
  const dietTxt = perP? `Household dietary requirements (STRICT — must be safe for every person): ${perP}.`:'';
  const avoidTxt = S.avoid.trim()? `Never include: ${S.avoid.trim()}.`:'';
  try{
    const p = `Find ONE real dinner recipe (web search if available), total time <= ${S.maxMinutes} min, scaled to ${tgt} servings. ${dietTxt} ${avoidTxt}
Must be different from all of these: ${others}; ${S.week.recipes[i].title}.
Respond ONLY minified JSON: {"title":"","url":"","source":"","prepMin":0,"cookMin":0,"summary":"","ingredients":[{"name":"","qty":0,"unit":"one of: ${UNITS}","category":"Produce|Meat & Seafood|Dairy & Eggs|Pantry|Frozen|Bakery"}]} Skip water/salt/pepper. <=12 ingredients.`;
    const r = await claude(p,true,2);
    r.day = S.week.recipes[i].day;
    r.ingredients = (r.ingredients||[]).filter(x=>x.name&&x.qty>0);
    S.week.recipes[i] = r;
    prog(65,'Rebuilding shopping list & prices…','');
    const shopping = consolidate(S.week.recipes);
    // reuse existing prices where names match; price only new items
    const old = S.week.shopping||[];
    const toPrice = [];
    shopping.forEach(it=>{
      const prev = old.find(o=> normName(o.name)===normName(it.name) && o.unit===it.unit && o.pkgQty);
      if(prev){ it.pkg=prev.pkg; it.pkgQty=prev.pkgQty; it.walmart=prev.walmart; it.aldi=prev.aldi;
        it.packs=Math.max(1,Math.ceil(it.need/it.pkgQty)); it.leftover=round2(it.packs*it.pkgQty-it.need);
      } else if(!it.pantryOnly) toPrice.push(it);
    });
    if(toPrice.length){
      const list = toPrice.map((it,ix)=>`${ix}: ${it.name} — need ${round2(it.need)} ${it.unit}`).join('\n');
      const r2 = await claude(`Estimate current US prices at Walmart and Aldi for these items. Package size in the same unit as stated.
${list}
ONLY JSON: {"items":[{"i":0,"pkg":"","pkgQty":0,"walmart":0,"aldi":0}]}`, true, 2);
      (r2.items||[]).forEach(x=>{ const t=toPrice[x.i]; if(!t)return;
        t.pkg=x.pkg; t.pkgQty=Math.max(.01,Number(x.pkgQty)||1);
        t.walmart=Number(x.walmart)||null; t.aldi=Number(x.aldi)||null;
        t.packs=Math.max(1,Math.ceil(t.need/t.pkgQty)); t.leftover=round2(t.packs*t.pkgQty-t.need); });
    }
    S.week.shopping = shopping; save();
    $('#progress').classList.remove('show'); render(); toast('Recipe swapped');
  }catch(e){ $('#progress').classList.remove('show'); if(e.message!=='cancelled'){lastErr=e.message;render();} }
}

    body=`<div class="onboard-kicker">Step 4 · Final touches</div>
      <h1 class="onboard-title" id="onboardTitle">Ready to build your week.</h1>
      <p class="onboard-copy">Choose where you shop and add an optional weekly grocery target.</p>
      <div class="onboard-panel"><h3>Preferred store</h3><div class="seg">${[['walmart','Walmart'],['aldi','Aldi'],['compare','Compare']].map(([v,l])=>`<button class="${S.store===v?'on':''}" onclick="S.store='${v}';save();renderOnboarding()">${l}</button>`).join('')}</div></div>

      <div class="onboard-summary"><div><small>Household</small><b>${S.household.length} ${S.household.length===1?'person':'people'}</b></div><div><small>Plan</small><b>${S.dinners} dinners · ${S.horizon} ${S.horizon===1?'week':'weeks'}</b></div><div><small>Time</small><b>Up to ${S.maxMinutes} min</b></div><div><small>Store</small><b>${storeName}</b></div></div>`;
  }
  el.innerHTML=`<div class="onboard-in" tabindex="-1"><div class="onboard-top"><div class="onboard-brand">Week<span>Plate</span></div>${progress}<button class="onboard-skip" onclick="skipOnboarding()">Skip</button></div>${body}</div>

}

function nearAge(age,a){ const g=x=> x<=3?0:x<=8?1:x<=13?2:x<=18?3:4; if(g(age)!==g(a)) return false; if(g(a)<4) return true; return Math.abs(age-a)<=7; }
function toggleDiet(pi,d){ const p=S.household[pi]; p.diet=p.diet||[]; const i=p.diet.indexOf(d); if(i>=0)p.diet.splice(i,1); else p.diet.push(d); save(); render(); }
function bindSetup(){
  const mm=$('#mm');
  const paint=()=>{ mm.style.setProperty('--fill', ((mm.value-15)/(120-15)*100)+'%'); $('#mmv').textContent=mm.value+' min'; };
  paint();
  mm.oninput=()=>{ S.maxMinutes=+mm.value; paint(); };
  mm.onchange=()=>{ save(); };
  $('#avoid').onchange=e=>{ S.avoid=e.target.value; save(); };
}

async function apiTest(){
  const out = document.getElementById('apiTestOut');
  out.textContent = 'Testing basic call…';
  const run = async (label, body)=>{
    try{
      const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01'}, body:JSON.stringify(body)});
      const raw = await res.text();
      return label+': HTTP '+res.status+'\n'+raw.slice(0,300);
    }catch(e){ return label+': fetch failed — '+e.message; }
  };
  const base = {model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user',content:'Reply with exactly: {"ok":true}'}]};
  const r1 = await run('1. Basic', base);
  out.textContent = r1+'\n\nTesting with web search…';
  const r2 = await run('2. With search', Object.assign({}, base, {tools:[{type:'web_search_20250305',name:'web_search'}]}));
  out.textContent = r1+'\n\n'+r2;
}

/* ================= boot ================= */
(async ()=>{
  await loadState(); applyCustomRecipes(); render(); await checkSharedLink();
  if(!S.onboardingDone && !new URLSearchParams(location.search).has('test')) setTimeout(()=>openOnboarding(0),0);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }
  if(new URLSearchParams(location.search).has('test')){
    window.__WP_TEST__={
      reset(overrides={}){ S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),overrides); migrate(); applyCustomRecipes(); },
      plan(){ libPlan(); return JSON.parse(JSON.stringify(S.week)); },
      state(){ return JSON.parse(JSON.stringify(S)); },
      recipe(title){ return RECIPES.find(r=>r.t===title); },
      violates(title,person){ const r=RECIPES.find(x=>x.t===title); return r?violatesPerson(r,person):false; },
      pantryUrgency
    };
  }
})();
