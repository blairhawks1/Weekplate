<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WeekPlate">
<meta name="theme-color" content="#F3F5EF">
<meta name="description" content="Private, device-local weekly meal planning, grocery pricing, and pantry tracking.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://weekplate.blairhawks1.workers.dev/">
<meta property="og:title" content="WeekPlate — Dinner decisions, handled.">
<meta property="og:description" content="Build a family-ready meal plan, priced shopping list, and smarter pantry in one tap.">
<meta property="og:image" content="https://weekplate.blairhawks1.workers.dev/icons/og-weekplate.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="WeekPlate — Dinner decisions, handled.">
<meta name="twitter:description" content="Build a family-ready meal plan, priced shopping list, and smarter pantry in one tap.">
<meta name="twitter:image" content="https://weekplate.blairhawks1.workers.dev/icons/og-weekplate.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>WeekPlate — Dinner Prep Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5EF; --card:#FFFFFF; --ink:#24312A; --muted:#68766D;
  --spruce:#2C5741; --spruce-deep:#1F4231; --leaf:#4E9C66; --leaf-bg:#EAF4ED;
  --squash:#D98E2B; --squash-bg:#FBF1E0;
  --line:#DEE4DA; --danger:#B4433A;
  --wm:#1B6FC2; --al:#12407E;
  --radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",-apple-system,sans-serif}
.mono{font-family:"Spline Sans Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--squash);outline-offset:2px}
button{touch-action:manipulation}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:calc(14px + var(--safe-t)) 18px 10px;display:flex;align-items:baseline;justify-content:space-between}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;color:var(--spruce-deep)}
header h1 span{color:var(--squash)}
#weekLabel{font-size:12px;color:var(--muted)}
main{flex:1;padding:0 14px calc(96px + var(--safe-b))}

/* bottom tabs */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 8px calc(8px + var(--safe-b));display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;font-size:10.5px;font-weight:600;color:var(--muted)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--spruce)}
nav button.on .dot{width:4px;height:4px;border-radius:2px;background:var(--squash)}
nav .dot{width:4px;height:4px;border-radius:2px;background:transparent}

/* ---------- shared bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin:10px 0}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800;color:var(--spruce-deep)}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:12px;background:var(--spruce);color:#fff;
  font-weight:700;font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--spruce);border:1.5px solid var(--spruce)}
.btn.warn{background:var(--squash)}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;
  border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--spruce);background:var(--leaf-bg);color:var(--spruce-deep)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.wm{background:#E7F0FA;color:var(--wm)}
.pill.al{background:#E8EDF6;color:var(--al)}
.pill.leaf{background:var(--leaf-bg);color:var(--spruce)}
.pill.sq{background:var(--squash-bg);color:#9A611A}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}
.empty p{font-size:13.5px;margin:4px 0}

.pcard{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#FBFCFA}
.pcard .pname{flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14.5px}
.pcard select{padding:9px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px}
.pcard .x{color:var(--danger);font-size:17px;padding:6px 6px}
.chip.mini{padding:5px 10px;font-size:12px}
/* stepper */
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.stepper button{width:46px;height:44px;font-size:22px;font-weight:600;color:var(--spruce)}
.stepper .val{flex:1;text-align:center;font-weight:800;font-size:17px}

/* slider */
input[type=range]{-webkit-appearance:none;width:100%;height:34px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--leaf) var(--fill,50%),var(--line) var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:13px;background:var(--card);border:2.5px solid var(--spruce);box-shadow:0 1px 4px rgba(0,0,0,.18)}

/* segmented */
.seg{display:flex;background:#E9EDE6;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--spruce-deep);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* people ages */
.person{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.person:last-child{border-bottom:none}
.person .who{flex:1;font-weight:700;font-size:14.5px}
.person .factor{font-size:11.5px;color:var(--muted)}
.person select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.person .x{color:var(--danger);font-size:18px;padding:6px 8px}

/* ---------- plan tab ---------- */
.homehero{position:relative;overflow:hidden;border-radius:20px;margin:4px 0 12px;min-height:390px;background:var(--spruce-deep);box-shadow:0 12px 30px rgba(31,66,49,.18)}
.homehero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.homehero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,42,29,.03) 20%,rgba(17,42,29,.9) 77%,#173526 100%)}
.homecopy{position:relative;z-index:1;padding:188px 20px 20px;color:#fff}
.homecopy h2{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;line-height:1.03;letter-spacing:-1px;margin:10px 0 8px;color:#fff;max-width:390px}
.homecopy p{margin:0 0 16px;color:#E3EEE7;font-size:14px;max-width:430px}
.homecopy .btn{background:var(--squash);color:#2B241A;box-shadow:0 5px 14px rgba(0,0,0,.2)}
.homestats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.homestat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.homestat b{display:block;font:800 16px "Bricolage Grotesque",sans-serif;color:var(--spruce-deep)}
.homestat span{font-size:10.5px;color:var(--muted)}
.howgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.howstep{background:#FBFCFA;border:1px solid var(--line);border-radius:12px;padding:11px}
.howstep i{display:flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:9px;background:var(--squash-bg);color:#9A611A;font-style:normal;font-weight:800;font-size:12px}
.howstep b{display:block;margin:8px 0 3px;font-size:12.5px;color:var(--spruce-deep)}
.howstep span{display:block;font-size:10.5px;line-height:1.35;color:var(--muted)}
.homesetup{display:flex;justify-content:center;margin:10px 0 2px}.homesetup button{font-size:12.5px;font-weight:700;color:var(--spruce);text-decoration:underline;text-underline-offset:3px}
@media(max-width:380px){.homecopy h2{font-size:28px}.homehero{min-height:410px}.howgrid{grid-template-columns:1fr}.howstep{display:grid;grid-template-columns:32px 1fr;column-gap:8px}.howstep b{margin:1px 0}.howstep span{grid-column:2}}
.recipe{padding:0;overflow:hidden}
.recipe .top{padding:14px 16px 10px}
.recipe .day{font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--squash)}
.recipe h3{margin:3px 0 5px;font-size:17px;font-weight:800;line-height:1.25}
.recipe .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.recipe .usesbar{background:var(--leaf-bg);padding:8px 16px;font-size:12px;color:var(--spruce-deep);border-top:1px solid var(--line)}
.recipe .usesbar.alt{background:var(--squash-bg);color:#8A5717}
.recipe .foot{display:flex;border-top:1px solid var(--line)}
.recipe .foot button{flex:1;padding:11px;font-size:13px;font-weight:700;color:var(--spruce)}
.recipe .foot button+button{border-left:1px solid var(--line)}
.ing-list{padding:4px 16px 12px;font-size:13.5px;display:none}
.ing-list.open{display:block}
.ing-list li{padding:3px 0;border-bottom:1px dotted var(--line)}
.ing-list .q{font-weight:700}
.reviewbar{background:linear-gradient(135deg,var(--spruce-deep),var(--spruce));color:#fff;border:none;padding:16px;margin-bottom:12px}
.reviewbar h2{color:#fff;font:800 20px "Bricolage Grotesque",sans-serif;margin-bottom:5px}
.reviewbar .sub{color:#DDE9E1;margin-bottom:12px}
.reviewbar.done{background:var(--leaf-bg);border:1.5px solid var(--leaf);color:var(--spruce-deep)}
.reviewbar.done h2{color:var(--spruce-deep);font-size:16px}.reviewbar.done .sub{color:var(--muted);margin:0}
.reviewactions{display:flex;gap:8px}.reviewactions .btn{margin:0}.reviewactions .ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.65)}
.plancal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px}
.calday{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;text-align:left;min-height:90px;box-shadow:0 2px 7px rgba(31,66,49,.04)}
.calday:active{background:var(--leaf-bg)}
.calday .cd{display:block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--squash)}
.calday .ct{display:block;margin:5px 0 7px;font-size:13px;font-weight:800;line-height:1.25;color:var(--spruce-deep)}
.calday .cm{display:flex;flex-wrap:wrap;gap:5px;font-size:10.5px;color:var(--muted)}
.calday.leftover{background:var(--squash-bg);border-color:#E8C998}
.calweek{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--spruce);padding:8px 2px 0}
@media(min-width:480px){.plancal{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* progress */
#progress{position:fixed;inset:0;z-index:60;background:rgba(243,245,239,.96);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
#progress.show{display:flex}
#progress .plate{width:74px;height:74px;border-radius:50%;border:4px solid var(--line);
  border-top-color:var(--squash);animation:spin 1s linear infinite;margin-bottom:22px}
@keyframes spin{to{transform:rotate(360deg)}}
#progress h2{margin:0 0 6px;font-size:19px}
#progWhat{font-size:13.5px;color:var(--muted);min-height:38px}
#progSteps{margin-top:18px;font-size:12px;color:var(--muted)}
#progBarWrap{width:min(320px,80vw);height:8px;background:var(--line);border-radius:4px;margin-top:14px;overflow:hidden}
#progBar{height:100%;width:0%;background:linear-gradient(90deg,var(--leaf),var(--squash));border-radius:4px;transition:width .5s}
#progCancel{margin-top:26px;font-size:13px;font-weight:700;color:var(--danger);text-decoration:underline}

/* ---------- receipt / shopping ---------- */
.receipt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;
  margin:10px 0 0;padding:16px 0 6px;
  filter:drop-shadow(0 2px 5px rgba(36,49,42,.08))}
.receipt-edge{height:12px;margin-bottom:12px;
  background:linear-gradient(-45deg,transparent 8px,var(--card) 8px) 0 0/16px 16px repeat-x,
             linear-gradient(45deg,transparent 8px,var(--card) 8px) 8px 0/16px 16px repeat-x}
.receipt .rhead{padding:0 18px 10px;border-bottom:1.5px dashed var(--line)}
.receipt .rhead h2{margin:0;font-size:15px;letter-spacing:.5px}
.rgrid{display:grid;grid-template-columns:1fr 62px 62px;gap:0 8px;align-items:center;padding:0 18px;font-size:13px}
.rgrid.head{padding-top:10px;padding-bottom:5px;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.rgrid .pr{text-align:right}
.ritem{border-bottom:1px dotted var(--line);padding:8px 0;display:contents}
.ritem>div{padding:8px 0;border-bottom:1px dotted var(--line)}
.ritem .nm{font-weight:600;font-size:13.5px;display:flex;align-items:flex-start;gap:8px}
.ritem .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ritem input[type=checkbox]{width:19px;height:19px;accent-color:var(--spruce);margin-top:1px;flex:none}
.ritem.done .nm{opacity:.42;text-decoration:line-through}
.best{position:relative}
.best::after{content:"";position:absolute;margin-left:3px;width:6px;height:6px;border-radius:3px;background:var(--leaf);display:inline-block}
.rtotals{padding:10px 18px 4px;border-top:1.5px dashed var(--line);margin-top:4px}
.rtotals .row{padding:3px 0;font-size:13.5px}
.rtotals .grand{font-size:16px;font-weight:800}
.savebadge{margin:10px 18px 6px;padding:9px 12px;border-radius:10px;background:var(--leaf-bg);
  color:var(--spruce-deep);font-size:13px;font-weight:700;text-align:center}
.catlabel{grid-column:1/-1;padding:9px 0 3px;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--squash)}

/* ---------- pantry ---------- */
.pitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pitem:last-child{border-bottom:none}
.pitem .nm{flex:1;font-weight:600;font-size:14px}
.pitem .qty{font-size:13px;color:var(--muted)}
.pitem .x{color:var(--danger);padding:6px 8px;font-size:17px}
.pitem.expiring{background:var(--squash-bg);margin:0 -8px;padding:10px 8px;border-radius:10px}
.pitem.expired{background:#FBEAE8;margin:0 -8px;padding:10px 8px;border-radius:10px}
.expiry{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}
.expiry.soon{color:#9A611A;font-weight:700}.expiry.late{color:var(--danger);font-weight:700}
.expirydate{width:132px;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-size:14px;min-width:0}
.addrow input.small{flex:0 0 66px}
.addrow button{flex:0 0 46px;background:var(--spruce);color:#fff;border-radius:11px;font-size:20px;font-weight:700}
.carry{background:var(--squash-bg);border-color:#EDD9B8}
.carry h2{color:#8A5717}

textarea#avoid{width:100%;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--card);font:inherit;font-size:14px;resize:none;height:64px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;
  z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.err{background:#FBEAE8;border:1px solid #EBC7C3;color:#7E2B24;border-radius:12px;padding:12px 14px;font-size:13.5px;margin:10px 0}

/* full-recipe sheet */
#sheet{position:fixed;inset:0;z-index:55;background:var(--paper);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet.show{display:block}
.sheet-in{max-width:560px;margin:0 auto;padding:0 18px calc(40px + var(--safe-b))}
.sheet-bar{position:sticky;top:0;background:var(--paper);padding:calc(12px + var(--safe-t)) 0 10px;display:flex;justify-content:flex-end;z-index:5}
.sheet-bar button{font-weight:800;font-size:14px;color:var(--spruce);padding:8px 14px;border:1.5px solid var(--spruce);border-radius:99px;background:var(--card)}
#sheet .day{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--squash)}
#sheet h2{margin:4px 0 8px;font-size:24px;font-weight:800;line-height:1.2;color:var(--spruce-deep)}
#sheet .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
#sheet h3{margin:20px 0 8px;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
#sheet .sing li{padding:6px 0;border-bottom:1px dotted var(--line);font-size:14.5px;list-style:none}
#sheet .sing{padding:0;margin:0}
#sheet .sing .q{font-weight:700}
#sheet ol{padding-left:22px;margin:0}
#sheet ol li{padding:7px 0;font-size:15px;line-height:1.5}
#sheet ol li::marker{font-weight:800;color:var(--squash)}

#printview{display:none}
@media print{
  body>#app, body>#progress, body>#sheet, body>.toast, nav{display:none!important}
  #printview{display:block;font:12pt Georgia,serif;color:#000}
  #printview h1{font-size:18pt} #printview h2{font-size:15pt;margin-bottom:2pt}
  #printview table{width:100%;border-collapse:collapse;margin:10pt 0}
  #printview td{border-bottom:1pt solid #999;padding:5pt 8pt 5pt 0}
  #printview .pbreak{page-break-before:always}
}

#pdfview{position:fixed;inset:0;z-index:80;background:#3a423c;display:none;flex-direction:column}
#pdfview.show{display:flex}
#pdfview .pv-bar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:var(--paper)}
#pdfview .pv-name{flex:1;font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pdfview .pv-bar button{font-weight:800;font-size:13px;color:var(--spruce);padding:7px 13px;border:1.5px solid var(--spruce);border-radius:99px;background:var(--card)}
#pdfview iframe{flex:1;border:none;width:100%;background:#fff}
#pdfview .pv-hint{padding:8px 14px calc(10px + var(--safe-b));font-size:11px;color:#DDE4DC;background:#3a423c;text-align:center}

.rvlist{margin-top:6px}
.rvrow{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#FBFCFA}
.rvrow.skip{opacity:.45}
.rvtop{display:flex;gap:8px;align-items:center}
.rvname{flex:1;min-width:0;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14.5px}

<body>
<div id="app">
  <header>
    <h1>Week<span>Plate</span> <span style="font-size:10px;font-weight:600;color:var(--muted);vertical-align:super">v30</span></h1>
    <div id="weekLabel"></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav id="nav" aria-label="Primary"></nav>
</div>

<div id="progress" role="status" aria-live="polite" aria-label="Planning progress">
  <div class="plate"></div>
  <h2 class="disp" id="progTitle">Building your week…</h2>
  <div id="progWhat"></div>
  <div id="progBarWrap"><div id="progBar"></div></div>
  <div id="progSteps"></div>
  <button id="progCancel">Cancel</button>
</div>
<div id="sheet"></div>
<div id="shop"></div>
<div id="onboarding" role="dialog" aria-modal="true" aria-labelledby="onboardTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
/* ================= state & storage ================= */
const DEFAULTS = {
  household:[{name:'',age:35,diet:[]},{name:'',age:35,diet:[]}],
  dinners:7, maxMinutes:45,
  store:'compare',            // walmart | aldi | compare
  mode:'lib',                 // lib (built-in, offline) | ai (web search)
  altNights:2,                // nights/week a restricted person gets their own meal
  priceBook:{},               // user prices from receipts: name -> {walmart,aldi,pkg,pkgQty,unit,ts}
  lastTitles:[],
  diet:[], avoid:'',
  pantry:[],                  // {name, qty, unit, addedAt, useBy}
  week:null,                  // {recipes:[], shopping:[], pricedAt, weekOf}
  weeksDone:0,
  favorites:[],               // recipe titles to favor
  blocked:[],                 // recipe titles to never show
  history:[],                 // last weeks: [{weekOf, titles, servings}]
  leftoverNights:0,           // cook-double nights per week (0-3)
  budgetCap:0,                // $/week target, 0 = off
  customRecipes:[],           // user-added recipes, same shape as library entries
  macro:{mode:'off',cal:0,protein:0,carbs:0,fat:0},  // per-serving targets; protein=min, others=max
  horizon:1,                  // 1 = one week, 2 = two-week plan (one shop, bulk shared)
  photos:{},                  // recipe title -> {src (compressed dataURL), ts}
  onboardingDone:false        // first-run guide completion
};
let S = JSON.parse(JSON.stringify(DEFAULTS));
let mem = {};               // fallback if window.storage unavailable
let saveTimer = null;

let STORE_KEY='weekplate-state';
let storageBackend='none';   // 'artifact' | 'local' | 'none'
let lastSaved=0, saveFailed=false;

/* --- layered persistence: artifact storage API, then localStorage, then memory --- */
async function rawGet(){
  // 1) Claude artifact storage
  try{
    if(window.storage && window.storage.get){
      const r = await window.storage.get(STORE_KEY);
      if(r && r.value){ storageBackend='artifact'; return r.value; }
      storageBackend='artifact'; return null;   // works, just empty
    }
  }catch(e){}
  // 2) localStorage (Netlify, Safari, home-screen app, plain browser)
  try{
    const v = window.localStorage.getItem(STORE_KEY);
    window.localStorage.setItem('__wp_test','1'); window.localStorage.removeItem('__wp_test');
    storageBackend='local';
    return v;
  }catch(e){}
  storageBackend='none';
  return null;
}
async function rawSet(str){
  let ok=false;
  try{
    if(window.storage && window.storage.set){
      await window.storage.set(STORE_KEY, str);
      storageBackend='artifact'; ok=true;
    }
  }catch(e){}
  if(!ok){
    try{ window.localStorage.setItem(STORE_KEY, str); storageBackend='local'; ok=true; }catch(e){}
  }
  if(!ok) storageBackend='none';
  saveFailed=!ok;
  if(ok) lastSaved=Date.now();
  return ok;
}

function migrate(){
  S.household = (S.household||[]).map(p=>Object.assign({name:'',diet:[]}, p));
  if(S.diet && S.diet.length){ S.household.forEach(p=>{ S.diet.forEach(d=>{ if(!p.diet.includes(d)) p.diet.push(d); }); }); S.diet=[]; }
  S.macro = Object.assign({mode:'off',cal:0,protein:0,carbs:0,fat:0}, S.macro||{});
  S.priceBook = S.priceBook||{}; S.customRecipes=S.customRecipes||[]; S.photos=S.photos||{};
  S.favorites=S.favorites||[]; S.blocked=S.blocked||[]; S.history=S.history||[];
  if(S.week && typeof S.week.planApproved==='undefined') S.week.planApproved=true;
  S.pantry=(S.pantry||[]).map(p=>Object.assign({addedAt:null,useBy:null},p));
  // v24: the unauthenticated browser-only AI path could never work safely.
  // Keep planning private, dependable, and fully offline.
  S.mode='lib';
}

async function loadState(){
  let raw=null;
  try{ raw = await rawGet(); }catch(e){}
  if(raw){
    try{
      const stored=JSON.parse(raw);
      // Saved data from before v28 belongs to an existing user; never interrupt them.
      if(!Object.prototype.hasOwnProperty.call(stored,'onboardingDone')) stored.onboardingDone=true;
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), stored);
    }
    catch(e){ /* corrupt payload: keep defaults rather than crash */ }
  } else if(mem.state){ S = mem.state; }
  migrate();
}

function save(){
  mem.state = S;                       // instant in-memory copy
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ rawSet(JSON.stringify(S)); }, 300);
}
async function saveNow(){
  mem.state = S; clearTimeout(saveTimer);
  return await rawSet(JSON.stringify(S));
}
/* flush before the app is backgrounded or closed — critical on iOS */
try{
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveNow(); });
  window.addEventListener('pagehide', ()=>{ saveNow(); });
  window.addEventListener('beforeunload', ()=>{ saveNow(); });
}catch(e){}

/* --- manual backup: works even when no storage backend exists --- */
function exportBackup(){
  const str = JSON.stringify(S);
  const blob = new Blob([str], {type:'application/json'});
  const name = 'weekplate-backup-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:name}).catch(()=>{});
      return;
    }
  }catch(e){}
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),20000);
    toast('Backup downloaded');
  }catch(e){
    // last resort: show the JSON to copy
    $('#sheet').innerHTML = `<div class="sheet-in">
      <div class="sheet-bar"><button onclick="closeSheet()">✕ Close</button></div>
      <h2 class="disp" style="font-size:19px">Backup code</h2>
      <p class="sub">Copy this and keep it somewhere safe. Paste it into Restore to bring everything back.</p>
      <textarea readonly onclick="this.select()" style="width:100%;height:200px;font:10px ui-monospace,monospace;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)">${esc(str)}</textarea>
      <button class="btn" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousElementSibling.value).then(()=>toast('Copied')).catch(()=>toast('Tap, Select All, Copy'))">Copy backup code</button>
    </div>`;
    $('#sheet').classList.add('show');
  }
}
function openRestore(){
  $('#sheet').innerHTML = `<div class="sheet-in">
    <div class="sheet-bar"><button onclick="closeSheet()">✕ Close</button></div>
    <h2 class="disp" style="font-size:19px">Restore from backup</h2>
    <p class="sub">Paste a backup code, or pick a backup file. This replaces everything currently in the app.</p>
    <button class="btn ghost" onclick="pickBackupFile()">Choose backup file…</button>
    <textarea id="rstText" placeholder="…or paste backup code here" style="width:100%;height:140px;margin-top:12px;font:10px ui-monospace,monospace;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)"></textarea>
    <button class="btn" style="margin-top:10px" onclick="restoreFromText(document.getElementById('rstText').value)">Restore</button>
  </div>`;
  $('#sheet').classList.add('show');
}
function pickBackupFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>restoreFromText(String(r.result)); r.readAsText(f); };
  inp.click();
}
async function restoreFromText(txt){
  if(!txt || !txt.trim()){ toast('Nothing to restore'); return; }
  let obj;
  try{ obj = JSON.parse(txt.trim()); }
  catch(e){ toast('That backup is not valid'); return; }
  if(!obj || typeof obj!=='object' || !obj.household){ toast('That backup is not valid'); return; }
  if(!Object.prototype.hasOwnProperty.call(obj,'onboardingDone')) obj.onboardingDone=true;
  S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), obj);
  migrate(); applyCustomRecipes(); clearCostCache(); clearNutCache();
  await saveNow();
  closeSheet(); tab='plan'; render();
  toast('Restored');
}

/* ================= helpers ================= */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n=> (n==null||isNaN(n)) ? '—' : '$'+Number(n).toFixed(2);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

function ageFactor(a){ if(a<=3)return .4; if(a<=8)return .6; if(a<=13)return .85; if(a<=18)return 1.2; return 1; }
function targetServings(){
  const f = S.household.reduce((s,p)=>s+ageFactor(p.age),0);
  return Math.max(1, Math.ceil(f));
}
function effectiveDiets(){
  const u=[]; S.household.forEach(p=>(p.diet||[]).forEach(d=>{ if(!u.includes(d)) u.push(d); }));
  (S.diet||[]).forEach(d=>{ if(!u.includes(d)) u.push(d); });
  return u;
}
function personLabel(p,i){ return (p.name&&p.name.trim()) ? p.name.trim() : 'Person '+(i+1); }
function dietSummaryTxt(){
  const withD = S.household.filter(p=>(p.diet||[]).length);
  if(!withD.length) return '';
  return withD.map((p)=> personLabel(p, S.household.indexOf(p))+': '+p.diet.join(', ')).join(' · ');
}
function ageLabel(a){ if(a<=3)return 'Toddler'; if(a<=8)return 'Kid'; if(a<=13)return 'Preteen'; if(a<=18)return 'Teen'; return 'Adult'; }

/* ================= Claude API ================= */
let cancelled = false;

function extractJSON(text){
  const t = text.replace(/```json|```/g,'');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a<0 || b<=a) return null;
  try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ return null; }
}

async function apiCall(messages, withTools){
  const body = { model:'claude-sonnet-4-6', max_tokens:1000, messages };
  if(withTools) body.tools = [{type:'web_search_20250305', name:'web_search'}];
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST', headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01'}, body:JSON.stringify(body)
  });
  const raw = await res.text();
  let data;
  try{ data = JSON.parse(raw); }
  catch(e){ throw new Error('HTTP '+res.status+': '+raw.slice(0,140)); }
  if(data.error) throw new Error('[HTTP '+res.status+(withTools?' +search':'')+'] '+(typeof data.error==='string'? data.error : (data.error.message||JSON.stringify(data.error).slice(0,140))));
  if(!data.content) throw new Error('Empty API response');
  return data;
}

async function claude(prompt, useSearch, retries=2){
  // attempt plan: try with search, then without (some environments reject tools)
  const modes = useSearch ? [true,true,false] : [false,false];
  let lastError = null;
  for(let attempt=0; attempt<=retries; attempt++){
    if(cancelled) throw new Error('cancelled');
    const withTools = modes[Math.min(attempt, modes.length-1)];
    try{
      let messages = [{role:'user', content:prompt}];
      let data = await apiCall(messages, withTools);
      // continue paused / truncated tool turns up to 4 times
      let hops = 0;
      while((data.stop_reason==='pause_turn' || (data.stop_reason==='max_tokens' && !(data.content||[]).some(b=>b.type==='text'&&b.text.includes('{')))) && hops<4){
        if(cancelled) throw new Error('cancelled');
        messages = messages.concat([{role:'assistant', content:data.content},
          {role:'user', content:'Continue. Remember: respond ONLY with the minified JSON object, nothing else.'}]);
        data = await apiCall(messages, withTools);
        hops++;
      }
      const text = (data.content||[]).map(b=>b.type==='text'?b.text:'').join('\n');
      const obj = extractJSON(text);
      if(!obj) throw new Error('No JSON in model reply');
      return obj;
    }catch(e){
      if(e.message==='cancelled') throw e;
      lastError = e;
      if(attempt===retries) throw lastError;
      await new Promise(r=>setTimeout(r,1200));
    }
  }
  throw lastError;
}

/* ===== offline planner ===== */
const DIET_TAG = {'Vegetarian':'vegetarian','Vegan':'vegan','Gluten-free':'gf','Dairy-free':'df','Low-carb':'lc','Kid-friendly':'kid'};
function passesAvoid(r, avoid){
  return !avoid.some(a=> r.t.toLowerCase().includes(a) || r.ing.some(([n])=>n.includes(a)));
}
function avoidList(){ return S.avoid.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean); }
function violatesPerson(src, p){
  return (p.diet||[]).some(d=> !src.tags.includes(DIET_TAG[d]));
}
function libPool(){  // time + dislikes only; diets handled per person
  const avoid = avoidList();
  let pool = [];
  for(let relax=0; relax<=3 && pool.length<S.dinners; relax++){
    const lim = relax<3 ? S.maxMinutes + relax*15 : 999;
    pool = RECIPES.filter(r=> r.m<=lim && passesAvoid(r, avoid) && !(S.blocked||[]).includes(r.t));
  }
  return pool;
}
function altPoolFor(p){  // recipes fully safe for this person
  const avoid = avoidList();
  return RECIPES.filter(r=> r.m<=S.maxMinutes+15 && passesAvoid(r, avoid) && !violatesPerson(r,p) && !(S.blocked||[]).includes(r.t));
}
function libPlan(){ libBuild(null); }
function libReshuffle(){
  if(!S.week || S.week.mode!=='lib') return;
  const avoidNow = S.week.recipes.filter(r=>!r.locked).map(r=>r.title);
  libBuild(S.week.recipes.map(r=> r.locked ? r : null), S.week.weekOf, avoidNow);
}
function libBuild(fixed, keepWeekOf, avoidTitles){
  const H = Math.max(1, Math.min(2, S.horizon||1));
  const perWeek = S.dinners;
  const n = perWeek * H;                                 // total nights to cover
  let k = Math.min((S.leftoverNights||0)*H, Math.floor(n/2)); // cook-double nights across horizon
  const tgt = targetServings(), scale = tgt/4;
  const pool = libPool();
  if(!pool.length){ lastErr='No library recipes match the time limit and dislikes.'; render(); return; }
  const restricted = S.household.filter(p=>(p.diet||[]).length);
  const allow = new Map();
  const safeSet = new Map();
  S.household.forEach(x=>{ safeSet.set(x, new Set(pool.filter(r=> !violatesPerson(r,x)).map(r=>r.t))); });
  restricted.forEach(p=>{
    const pSafe = safeSet.get(p);
    const someoneBroader = S.household.some(x=> x!==p && [...safeSet.get(x)].some(t=> !pSafe.has(t)));
    allow.set(p, (someoneBroader && altPoolFor(p).length) ? (S.altNights??2)*H : 0);
  });
  const off = new Map(); restricted.forEach(p=> off.set(p,0));
  const counts = {}, uses = {}, chosenIng = new Set();
  const lockedRecs = fixed ? fixed.filter(Boolean) : [];
  const lockedTitles = lockedRecs.map(r=>r.title);
  const favActive = new Set((S.favorites||[]).filter(()=> Math.random() < 0.34));
  // seed bookkeeping with locked picks (a locked double violating someone costs its span)
  lockedRecs.forEach(fx=>{
    const src = RECIPES.find(x=>x.t===fx.title);
    if(src){
      counts[src.p]=(counts[src.p]||0)+1;
      src.ing.forEach(([nm])=>chosenIng.add(nm));
      const span = fx.double?2:1;
      restricted.forEach(p=>{ if(violatesPerson(src,p)) off.set(p, off.get(p)+span); });
    }
    uses[fx.title]=(uses[fx.title]||0)+1;
  });
  // how many recipes to pick: locked recipes already cover their span
  const lockedSpan = lockedRecs.reduce((s,r)=>s+(r.double?2:1),0);
  const lockedDoubles = lockedRecs.filter(r=>r.double).length;
  let kLeft = Math.max(0, k - lockedDoubles);
  let nightsLeft = n - lockedSpan;
  if(nightsLeft < 0){ nightsLeft = 0; }
  // budget pacing
  const budget = S.budgetCap||0;
  // macro tracking (weekly mode paces sums of per-serving values)
  const M = S.macro||{mode:'off'};
  let mc=0,mp=0,mb=0,mf=0, macroRelaxed=false;
  lockedRecs.forEach(fx=>{ const src=RECIPES.find(x=>x.t===fx.title); if(src){ const n=recipeNut4(src); const sp=fx.double?2:1; mc+=n.cal*sp; mp+=n.protein*sp; mb+=n.carbs*sp; mf+=n.fat*sp; } });
  let spent = lockedRecs.reduce((s,r)=>{ const src=RECIPES.find(x=>x.t===r.title); return s + (src? recipeCost4(src)*( (r.servings||tgt)/4 ):0); },0);
  const cap = Math.max(1, Math.ceil(n/3.5));
  const out = lockedRecs.slice();
  let guard=0;
  while(nightsLeft>0 && guard++<40){
    const wantDouble = kLeft>0 && nightsLeft>=2;
    const span = wantDouble?2:1;
    const mustSatisfy = restricted.filter(p=> off.get(p)+span-1 >= allow.get(p)); // doubles need span allowance
    const okSpan = r=> restricted.every(p=> !violatesPerson(r,p) || off.get(p)+span <= allow.get(p));
    let base = pool.filter(okSpan);
    if(wantDouble){
      // doubles must reheat well AND violate no one (keeps alt math simple & fair)
      let dbase = base.filter(r=> reheatsWell(r.t) && restricted.every(p=>!violatesPerson(r,p)));
      if(!dbase.length) dbase = base.filter(r=> restricted.every(p=>!violatesPerson(r,p)));
      if(!dbase.length){ kLeft=0; continue; } // give up doubling, replan slot as single
      base = dbase;
    }
    if(!base.length) base = pool.filter(r=> mustSatisfy.every(p=> !violatesPerson(r,p)));
    if(!base.length) base = pool.filter(r=> restricted.every(p=> !violatesPerson(r,p)));
    if(!base.length){
      const stuck = (mustSatisfy.length?mustSatisfy:restricted).map(p=>personLabel(p,S.household.indexOf(p))+' ('+(p.diet||[]).join(' + ')+')').join(', ');
      lastErr='No dinners in the library fit everyone at once: '+stuck+'. Loosen a restriction, raise alternate nights, or shorten the week.';
      render(); return;
    }
    if(M.mode==='day'){
      let bm = base.filter(r=>macroOK(r,1));
      if(!bm.length){ bm = base.filter(r=>macroOK(r,1.15)); if(bm.length) macroRelaxed=true; }
      if(!bm.length){ bm = base.filter(r=>macroOK(r,1.35)); if(bm.length) macroRelaxed=true; }
      if(bm.length) base = bm; else macroRelaxed=true; // give up quietly for this slot
    }
    let cands = base.filter(r=> !uses[r.t] && (counts[r.p]||0) < cap);
    if(!cands.length) cands = base.filter(r=> !uses[r.t]);
    if(!cands.length){
      const min = Math.min(...base.map(r=>uses[r.t]||0));
      cands = base.filter(r=> (uses[r.t]||0)===min);
    }
    const slotIdx = out.length;
    const totalSlots = out.length + Math.ceil(nightsLeft/ (wantDouble?2:1));
    let best=null, bs=-1e9;
    cands.forEach(r=>{
      let s = Math.random()*(avoidTitles?3.5:1.5), pb = 0;
      if(avoidTitles && avoidTitles.includes(r.t)) s -= 5;
      r.ing.forEach(([nm])=>{
        const cat = PRICES[nm].cat;
        const perish = cat==='Produce'||cat==='Dairy & Eggs'||cat==='Meat & Seafood';
        if(S.pantry.some(p=>normName(p.name)===normName(nm))) pb += (perish?2.5:0.25)+pantryUrgency(nm);
        if((cat==='Produce'||cat==='Dairy & Eggs') && chosenIng.has(nm)) s += 0.8;
      });
      s += Math.min(pb, 12);
      restricted.forEach(p=>{ if(violatesPerson(r,p)) s -= 0.8; });
      if(S.lastTitles.includes(r.t)) s -= 6;
      if(favActive.has(r.t)) s += 8;
      else if((S.favorites||[]).includes(r.t)) s -= 2.5;
      if(lockedTitles.includes(r.t)) s -= 20;
      if(M.mode==='week'){
        const n4 = recipeNut4(r);
        const nightsUsed = (n - nightsLeft) + span;
        const frac = nightsUsed/n;
        const HW = H; // weekly targets apply per week; scale to the horizon
        if(M.cal>0){ const proj=mc+n4.cal*span, pace=M.cal*HW*frac; if(proj>pace) s -= (proj-pace)*0.012; }
        if(M.carbs>0){ const proj=mb+n4.carbs*span, pace=M.carbs*HW*frac; if(proj>pace) s -= (proj-pace)*0.06; }
        if(M.fat>0){ const proj=mf+n4.fat*span, pace=M.fat*HW*frac; if(proj>pace) s -= (proj-pace)*0.10; }
        if(M.protein>0){ const proj=mp+n4.protein*span, pace=M.protein*HW*frac; if(proj<pace) s -= (pace-proj)*0.10; else s += Math.min(1.2,(proj-pace)*0.02); }
      }
      if(budget>0){
        const c = recipeCost4(r)*scale*span;
        const paceAfter = (budget*H) * ((n-nightsLeft+span)/n);
        const projected = spent + c;
        // pace against ~82% of the cap: pack rounding inflates the checkout total vs marginal cost
        const paceTarget = paceAfter*0.82;
        if(projected > paceTarget) s -= (projected-paceTarget)*1.4;
        else s += Math.min(1.5, (paceTarget-projected)*0.1);
      }
      if(s>bs){ bs=s; best=r; }
    });
    const rec = libRecipeObj(best, '', scale*(wantDouble?2:1));
    if(wantDouble) rec.double = true;
    rec.offFor = restricted.filter(p=>violatesPerson(best,p)).map((p)=>personLabel(p,S.household.indexOf(p)));
    restricted.forEach(p=>{ if(violatesPerson(best,p)) off.set(p, off.get(p)+span); });
    out.push(rec);
    counts[best.p]=(counts[best.p]||0)+1; uses[best.t]=(uses[best.t]||0)+1;
    best.ing.forEach(([nm])=>chosenIng.add(nm));
    spent += recipeCost4(best)*scale*span;
    { const n4=recipeNut4(best); mc+=n4.cal*span; mp+=n4.protein*span; mb+=n4.carbs*span; mf+=n4.fat*span; }
    nightsLeft -= span;
    if(wantDouble) kLeft--;
  }
  assignDays(out, n);
  finalizeWeek(out, keepWeekOf, !!fixed);
  if(S.week) S.week.macroRelaxed = macroRelaxed;
}
/* lay recipes onto the horizon: doubles take their day + the next as leftovers */
function assignDays(recipes, n){
  const doubles=recipes.filter(r=>r.double), singles=recipes.filter(r=>!r.double);
  const ordered=[];
  while(doubles.length||singles.length){
    if(doubles.length) ordered.push(doubles.shift());
    if(singles.length) ordered.push(singles.shift());
  }
  const perWeek = S.dinners;
  let d=0;
  ordered.forEach(r=>{
    r.week = Math.floor(d/perWeek)+1;
    r.day = DAYS[d%perWeek]||('Day '+(d+1));
    if(r.double){
      const ld=d+1;
      r.leftoverDay = DAYS[ld%perWeek]||('Day '+(ld+1));
      r.leftoverWeek = Math.floor(ld/perWeek)+1;
      d+=2;
    } else { delete r.leftoverDay; delete r.leftoverWeek; d+=1; }
  });
  recipes.length=0; ordered.forEach(r=>recipes.push(r));
}

/* build alternates for anyone excluded on some nights, consolidate, price, save */
function finalizeWeek(mains, keepWeekOf, wasReshuffle){
  const tgt = targetServings();
  // recompute offFor from source recipes (covers swapped/locked mains too)
  const restricted = S.household.filter(p=>(p.diet||[]).length);
  mains.forEach(rec=>{
    const src = RECIPES.find(x=>x.t===rec.title);
    rec.offFor = src ? restricted.filter(p=>violatesPerson(src,p)).map(p=>personLabel(p,S.household.indexOf(p))) : (rec.offFor||[]);
  });
  const alts = [];
  restricted.forEach(p=>{
    const name = personLabel(p, S.household.indexOf(p));
    const H0 = Math.max(1, Math.min(2, S.horizon||1));
    const lbl = (day, wk)=> H0>1? ('W'+wk+' '+day) : day;
    const nights = mains.flatMap(r=>(r.offFor||[]).includes(name)?
      [lbl(r.day,r.week||1)].concat(r.leftoverDay? [lbl(r.leftoverDay, r.leftoverWeek||r.week||1)]:[]) : []);
    if(!nights.length) return;
    const pool = altPoolFor(p);
    if(!pool.length) return;
    const mainIng = new Set(); mains.forEach(r=>(r.ingredients||[]).forEach(x=>mainIng.add(x.name)));
    let best=null, bs=-1e9;
    pool.forEach(r=>{
      let s = Math.random() + (45-Math.min(r.m,45))/30;
      r.ing.forEach(([nm])=>{
        if(mainIng.has(nm)) s += 0.7;
        if(S.pantry.some(pp=>normName(pp.name)===normName(nm))) s += 1.2;
      });
      if(S.lastTitles.includes(r.t)) s -= 2;
      if(s>bs){ bs=s; best=r; }
    });
    const servings = round2(nights.length * ageFactor(p.age));
    const rec = libRecipeObj(best, 'ALT', servings/4);
    rec.altFor = name; rec.altServes = servings; rec.nights = nights;
    alts.push({person:name, nights, rec});
  });
  const shopping = consolidate(mains.concat(alts.map(a=>a.rec)));
  libPrice(shopping);
  S.week = { recipes:mains, alts, shopping, weekOf: keepWeekOf || new Date().toISOString().slice(0,10),
             servings:tgt, mode:'lib', horizon:Math.max(1,Math.min(2,S.horizon||1)), planApproved:false };
  save(); tab='plan'; render();
  const nAlt = alts.length;
  toast(`${wasReshuffle?'Reshuffled':'Planned'} · ${shopping.filter(i=>!i.pantryOnly).length} items${nAlt? ` · ${nAlt} alternate meal${nAlt>1?'s':''}`:''}`);
}
function rescaleRecipe(rec, newServings){
  const src = RECIPES.find(x=>x.t===rec.title); if(!src) return;
  const scale = newServings/4;
  rec.servings = newServings;
  rec.ingredients = src.ing.map(([nm,q,u])=>({name:nm, qty:round2(q*scale), unit:u, category:PRICES[nm].cat}));
}
function libRecipeObj(r, day, scale){
  return { day, title:r.t, source:'built-in library', url:null, steps:STEPS[r.t]||[],
    prepMin:Math.round(r.m*0.35), cookMin:r.m-Math.round(r.m*0.35),
    summary:'', servings:round2(scale*4),
    ingredients: r.ing.map(([nm,q,u])=>({name:nm, qty:round2(q*scale), unit:u, category:PRICES[nm].cat})) };
}
function libPrice(items){
  items.forEach(it=>{
    if(it.pantryOnly) return;
    const base = PRICES[it.name.toLowerCase()] || PRICES[normName(it.name)];
    const ov = (S.priceBook||{})[normName(it.name)];
    // start from built-in estimate
    if(base && base.u===it.unit){ it.pkg=base.pkg; it.pkgQty=base.q; it.walmart=base.w; it.aldi=base.a; it.est=true; }
    else { it.pkg='estimate'; it.pkgQty=it.need; it.walmart=null; it.aldi=null; it.est=true; }
    // override with receipt data where units line up
    if(ov && ov.unit===it.unit){
      if(ov.pkg) it.pkg=ov.pkg;
      if(ov.pkgQty) it.pkgQty=ov.pkgQty;
      if(ov.walmart!=null) it.walmart=ov.walmart;
      if(ov.aldi!=null) it.aldi=ov.aldi;
      it.est=false; it.userPriced=true;
    }
    it.packs=Math.max(1,Math.ceil(it.need/it.pkgQty));
    it.leftover=round2(it.packs*it.pkgQty-it.need);
  });
}
function libSwap(i){
  const w=S.week, tgt=w.servings;
  const oldRec = w.recipes[i];
  const span = oldRec.double?2:1;
  const scale = (tgt/4)*span;
  const used = w.recipes.map(r=>r.title);
  const restricted = S.household.filter(p=>(p.diet||[]).length);
  const off = new Map(); restricted.forEach(p=>off.set(p,0));
  w.recipes.forEach((r,x)=>{ if(x===i) return;
    const src=RECIPES.find(z=>z.t===r.title); if(!src) return;
    const sp=r.double?2:1;
    restricted.forEach(p=>{ if(violatesPerson(src,p)) off.set(p, off.get(p)+sp); });
  });
  const allow = new Map(); restricted.forEach(p=> allow.set(p, altPoolFor(p).length ? (S.altNights??2) : 0));
  let pool = libPool().filter(r=> !used.includes(r.t)
    && restricted.every(p=> !violatesPerson(r,p) || off.get(p)+span <= allow.get(p)));
  if(oldRec.double){
    const dpool = pool.filter(r=> reheatsWell(r.t) && restricted.every(p=>!violatesPerson(r,p)));
    if(dpool.length) pool = dpool;
    else pool = pool.filter(r=> restricted.every(p=>!violatesPerson(r,p)));
  }
  if((S.macro||{}).mode==='day'){
    const mp2 = pool.filter(r=>macroOK(r,1)); if(mp2.length) pool = mp2;
    else { const mp3=pool.filter(r=>macroOK(r,1.35)); if(mp3.length) pool=mp3; }
  }
  if(!pool.length){ toast('No other eligible recipes in the library'); return; }
  const r = pool[Math.floor(Math.random()*pool.length)];
  const rec = libRecipeObj(r, oldRec.day, scale);
  if(oldRec.double){ rec.double=true; rec.leftoverDay=oldRec.leftoverDay; }
  if(oldRec.locked) rec.locked = oldRec.locked;
  w.recipes[i] = rec;
  finalizeWeek(w.recipes, w.weekOf, false);
  toast('Recipe swapped');
}

/* ================= plan generation ================= */
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const UNITS = 'lb, oz, count, cup, tbsp, tsp, clove, can, bunch, head, pkg';

function prog(pct, what, steps){
  $('#progBar').style.width = pct+'%';
  if(what!=null) $('#progWhat').textContent = what;
  if(steps!=null) $('#progSteps').textContent = steps;
}

function generateWeek(){
  lastErr=null;
  if(S.mode==='lib'){ libPlan(); return; }
  aiGenerate().catch(async e=>{
    $('#progress').classList.remove('show');
    if(e.message!=='cancelled'){ toast('AI unavailable — used built-in library'); libPlan(); }
  });
}
async function aiGenerate(){
  cancelled = false;
  $('#progress').classList.add('show');
  const n = S.dinners, tgt = targetServings();
  const perP = S.household.filter(p=>(p.diet||[]).length).map((p)=>`${personLabel(p,S.household.indexOf(p))}: ${p.diet.join(', ')}`).join('; ');
  const dietTxt = perP? `Household dietary requirements (STRICT — every dinner must be safe for every person): ${perP}.` : '';
  const avoidTxt = S.avoid.trim()? `Never include these ingredients/dishes: ${S.avoid.trim()}.` : '';
  const pantryTxt = S.pantry.length
    ? `PANTRY TO USE UP (prioritize recipes that use these before they go to waste): ${S.pantry.map(p=>`${p.qty} ${p.unit} ${p.name}`).join('; ')}.`
    : 'Pantry is empty.';
  const recipes = [];
  try{
    for(let i=0;i<n;i++){
      prog(Math.round(i/(n+2)*100), `Finding dinner ${i+1} of ${n}…`, recipes.map(r=>'✓ '+r.title).join('\n'));
      const already = recipes.length? `Already planned this week (pick something different in protein/cuisine): ${recipes.map(r=>r.title).join('; ')}.`:'';
      const p = `You are a meal-prep planner. Find ONE real dinner recipe for ${DAYS[i]} (use web search if available, otherwise a well-known recipe you know).
HARD CONSTRAINTS:
- Total time (prep + cook) must be <= ${S.maxMinutes} minutes.
- Scale ingredient quantities to ${tgt} servings.
${dietTxt} ${avoidTxt}
${pantryTxt}
${already}
Favor recipes sharing perishable ingredients with earlier picks so packages get fully used (e.g., if Monday uses half a bunch of cilantro, another day should use the rest).
Respond ONLY with minified JSON, no markdown, no prose:
{"title":"","url":"","source":"site name","prepMin":0,"cookMin":0,"summary":"one short sentence","ingredients":[{"name":"generic grocery name","qty":0,"unit":"one of: ${UNITS}","category":"Produce|Meat & Seafood|Dairy & Eggs|Pantry|Frozen|Bakery"}]}
Rules: qty is a number for ${tgt} servings. Use generic purchasable names ("chicken thighs", not brand names). Skip water, salt, pepper. Keep ingredients <= 10. summary <= 10 words. Minify: no spaces or newlines in the JSON.`;
      const r = await claude(p, true, 2);
      r.day = DAYS[i];
      r.ingredients = (r.ingredients||[]).filter(x=>x.name&&x.qty>0);
      recipes.push(r);
    }
    // consolidate
    prog(Math.round(n/(n+2)*100), 'Combining shopping list…','');
    const shopping = consolidate(recipes);
    // price in chunks
    const chunks = [];
    for(let i=0;i<shopping.length;i+=5) chunks.push(shopping.slice(i,i+5));
    for(let c=0;c<chunks.length;c++){
      prog(Math.round((n+1+c/chunks.length)/(n+2)*100), `Pricing at Walmart & Aldi… (${c+1}/${chunks.length})`, '');
      const list = chunks[c].map((it,ix)=>`${ix}: ${it.name} — need ${round2(it.need)} ${it.unit}`).join('\n');
      const p = `Estimate CURRENT typical US prices at Walmart and at Aldi for these grocery items (use web search if available, otherwise best knowledge of 2026 prices). For each item choose a realistic standard package (e.g. "1 lb pack", "dozen", "15 oz can") and express the package size in the SAME unit as the need.
Items:
${list}
Respond ONLY with minified JSON, no markdown:
{"items":[{"i":0,"pkg":"short package description","pkgQty":0,"walmart":0.00,"aldi":0.00}]}
pkgQty = amount per package in the item's stated unit (number). walmart/aldi = price per ONE package in USD. If a store likely doesn't carry it, still give best-estimate price.`;
      try{
        const r = await claude(p, true, 2);
        (r.items||[]).forEach(it=>{
          const t = chunks[c][it.i]; if(!t) return;
          t.pkg = it.pkg; t.pkgQty = Math.max(0.01, Number(it.pkgQty)||1);
          t.walmart = Number(it.walmart)||null; t.aldi = Number(it.aldi)||null;
          t.packs = Math.max(1, Math.ceil(t.need / t.pkgQty));
          t.leftover = round2(t.packs * t.pkgQty - t.need);
        });
      }catch(e){
        chunks[c].forEach(t=>{ t.pkg='est.'; t.pkgQty=t.need; t.packs=1; t.leftover=0; });
      }
    }
    prog(100,'Done!','');
    S.week = { recipes, shopping, weekOf: new Date().toISOString().slice(0,10), servings: tgt, planApproved:false };
    save();
    $('#progress').classList.remove('show');
    tab='plan'; render();
    toast(`Planned ${n} dinners · ${shopping.length} items to buy`);
  }catch(e){
    $('#progress').classList.remove('show');
    throw e;
  }
}
let lastErr = null;
$('#progCancel').onclick = ()=>{ cancelled = true; $('#progress').classList.remove('show'); };

function round2(n){ return Math.round(n*100)/100; }
function normName(s){ return s.toLowerCase().replace(/\b(fresh|large|small|medium|boneless|skinless)\b/g,'').replace(/s\b/,'').replace(/[^a-z ]/g,'').trim(); }
function isoToday(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(days){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function defaultShelfDays(name){
  const item=PRICES[normName(name)]||PRICES[String(name).toLowerCase()];
  return {'Meat & Seafood':2,'Produce':5,'Dairy & Eggs':7,'Bakery':5,'Frozen':90,'Pantry':180}[item?.cat]||14;
}
function pantryDaysLeft(p){
  if(!p?.useBy) return null;
  const end=new Date(p.useBy+'T12:00:00'), now=new Date(); now.setHours(12,0,0,0);
  return Math.round((end-now)/86400000);
}
function pantryExpiryLabel(p){
  const days=pantryDaysLeft(p);
  if(days==null) return p.addedAt? 'Added '+new Date(p.addedAt+'T12:00:00').toLocaleDateString() : 'Date unknown';
  if(days<0) return `${Math.abs(days)} day${Math.abs(days)!==1?'s':''} past use-by`;
  if(days===0) return 'Use today';
  if(days===1) return 'Use tomorrow';
  return `Use within ${days} days`;
}
function pantryUrgency(name){
  const p=(S.pantry||[]).find(x=>normName(x.name)===normName(name));
  if(!p) return 0;
  const days=pantryDaysLeft(p);
  if(days==null) return 0;
  if(days<=0) return 7;
  if(days<=2) return 5;
  if(days<=5) return 3;
  return 0;
}

function consolidate(recipes){
  const map = {};
  recipes.forEach(r=> (r.ingredients||[]).forEach(ing=>{
    const key = normName(ing.name)+'|'+ing.unit;
    if(!map[key]) map[key] = { name:ing.name, unit:ing.unit, category:ing.category||'Pantry', gross:0, usedBy:[] };
    map[key].gross += Number(ing.qty)||0;
    if(!map[key].usedBy.includes(r.day)) map[key].usedBy.push(r.day);
  }));
  const items = [];
  Object.values(map).forEach(it=>{
    // subtract pantry
    let need = it.gross, fromPantry = 0;
    const pi = S.pantry.find(p=> normName(p.name)===normName(it.name) && p.unit===it.unit);
    if(pi){
      fromPantry = Math.min(pi.qty, need);
      need = round2(need - fromPantry);
    }
    it.fromPantry = round2(fromPantry);
    it.need = round2(need);
    it.gross = round2(it.gross);
    if(it.need > 0.01) items.push(it); else if(fromPantry>0) items.push(Object.assign(it,{pantryOnly:true}));
  });
  const order = ['Produce','Meat & Seafood','Dairy & Eggs','Bakery','Frozen','Pantry'];
  items.sort((a,b)=> order.indexOf(a.category)-order.indexOf(b.category) || a.name.localeCompare(b.name));
  return items;
}

/* finish week: leftovers -> pantry */
function finishWeek(){
  if(!S.week) return;
  const w = S.week;
  // consume pantry that was used
  w.shopping.forEach(it=>{
    if(it.fromPantry>0){
      const pi = S.pantry.find(p=> normName(p.name)===normName(it.name) && p.unit===it.unit);
      if(pi){ pi.qty = round2(pi.qty - it.fromPantry); }
    }
  });
  S.pantry = S.pantry.filter(p=>p.qty>0.01);
  // add purchase leftovers
  let added = 0;
  w.shopping.forEach(it=>{
    if(it.pantryOnly || !(it.leftover>0.01)) return;
    if(it.pkgQty && it.leftover < 0.1*it.pkgQty) return; // scrap, nearly used up
    // skip trivially small leftovers of cheap staples? keep all, user can delete
    const pi = S.pantry.find(p=> normName(p.name)===normName(it.name) && p.unit===it.unit);
    if(pi){ pi.qty=round2(pi.qty+it.leftover); pi.addedAt=isoToday(); pi.useBy=addDaysISO(defaultShelfDays(it.name)); }
    else S.pantry.push({name:it.name,qty:it.leftover,unit:it.unit,addedAt:isoToday(),useBy:addDaysISO(defaultShelfDays(it.name))});
    added++;
  });
  S.lastTitles = w.recipes.map(r=>r.title);
  S.history = S.history||[];
  S.history.unshift({weekOf:w.weekOf, titles:w.recipes.map(r=>r.title), servings:w.servings, horizon:w.horizon||1, ts:Date.now()});
  S.history = S.history.slice(0,8);
  S.weeksDone++; S.week = null; save();
  tab='pantry'; render();
  toast(added? `${added} leftover items moved to pantry` : 'Week finished — no leftovers');
}


/* ===== PDF export (self-contained writer, no network) ===== */
function MiniPDF(){
  const W=612, H=792, pages=[];
  let ops=null;
  const WIN = {'\u00B0':0xB0,'\u00B7':0xB7,'\u2013':0x96,'\u2014':0x97,'\u00D7':0xD7,'\u00E9':0xE9,'\u2019':0x92,'\u2018':0x91,'\u201C':0x93,'\u201D':0x94,'\u00BD':0xBD,'\u00BC':0xBC,'\u00BE':0xBE};
  const NARROW=" iIljt.,:;'!|()[]/\\-", WIDE="mwMW@";
  function chW(ch){ if(NARROW.includes(ch))return .31; if(WIDE.includes(ch))return .89; if(ch>='0'&&ch<='9')return .556; if(ch==='$')return .556; if(ch>='A'&&ch<='Z')return .70; return .52; }
  function width(str,size,bold){ let w=0; for(const c of String(str)) w+=chW(c); return w*size*(bold?1.05:1); }
  function enc(str){
    let out='';
    for(const ch of String(str)){
      const c=ch.charCodeAt(0);
      if(ch==='('||ch===')'||ch==='\\') out+='\\'+ch;
      else if(c<128) out+=ch;
      else if(WIN[ch]!==undefined) out+='\\'+WIN[ch].toString(8).padStart(3,'0');
      else out+='?';
    }
    return out;
  }
  function col(c){ return c.map(v=>(v/255).toFixed(3)).join(' '); }
  function addPage(){ ops=[]; pages.push(ops); }
  function text(x,y,str,o){ o=o||{};
    const size=o.size||11, f=o.bold?'F2':'F1', c=o.color||[36,49,42];
    let tx = o.align==='right' ? x - width(str,size,o.bold) : x;
    ops.push('BT /'+f+' '+size+' Tf '+col(c)+' rg 1 0 0 1 '+tx.toFixed(1)+' '+(H-y).toFixed(1)+' Tm ('+enc(str)+') Tj ET');
  }
  function line(x1,y1,x2,y2,c,w){ ops.push(col(c||[210,216,206])+' RG '+(w||1)+' w '+x1+' '+(H-y1).toFixed(1)+' m '+x2+' '+(H-y2).toFixed(1)+' l S'); }
  function rect(x,y,w,h,c,fill){ ops.push(col(c)+(fill?' rg ':' RG 1 w ')+x+' '+(H-y-h).toFixed(1)+' '+w+' '+h+' re '+(fill?'f':'S')); }
  function wrap(str,maxW,size,bold){
    const words=String(str).split(' '), lines=[]; let cur='';
    words.forEach(wd=>{
      const t=cur?cur+' '+wd:wd;
      if(width(t,size,bold)<=maxW) cur=t;
      else { if(cur) lines.push(cur); cur=wd; }
    });
    if(cur) lines.push(cur);
    return lines.length?lines:[''];
  }
  function output(){
    // objects: 1 catalog, 2 pages, 3 F1, 4 F2, then per page: page+content
    const objs=[];
    const kids = pages.map((_,i)=>(5+i*2)+' 0 R').join(' ');
    objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
    objs[2]='<< /Type /Pages /Kids ['+kids+'] /Count '+pages.length+' >>';
    objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    pages.forEach((p,i)=>{
      const stream=p.join('\n');
      objs[5+i*2]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+i*2)+' 0 R >>';
      objs[6+i*2]='<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream';
    });
    let pdf='%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n';
    const offs=[];
    for(let i=1;i<objs.length;i++){ offs[i]=pdf.length; pdf+=i+' 0 obj\n'+objs[i]+'\nendobj\n'; }
    const xref=pdf.length;
    pdf+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
    for(let i=1;i<objs.length;i++) pdf+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
    pdf+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    return pdf;
  }
  return {addPage,text,line,rect,wrap,width,output,W,H};
}

function buildPDFDoc(){
  const d = MiniPDF();
  const M=46, W=d.W, CW=W-2*M, BOT=744;

    if(r.leftoverDay) dayRows.push({r, day:r.leftoverDay, main:false, wk:r.leftoverWeek||r.week||1});
  });
  const H1=(w.horizon||1);
  const rowH=Math.min(H1>1?52:78, Math.floor((706-y)/Math.max(1,dayRows.length + (H1>1?2:0))));
  let curWk=0;
  dayRows.forEach(({r,day,main,wk})=>{

    d.text(M,y,day.toUpperCase()+(r.double?'  (COOK x2)':'')+(r.locked?'  (LOCKED)':''),{size:9,bold:true,color:squash});

    const nu=recipeNutrition(r);
    let meta=((r.prepMin||0)+(r.cookMin||0))+' min   \u00B7   '+(r.ingredients||[]).length+' ingredients'+(nu.cal?('   \u00B7   ~'+nu.cal+' cal \u00B7 '+nu.protein+'P/'+nu.carbs+'C/'+nu.fat+'F per serv'):'');
    if(uses.length) meta+='   \u00B7   from pantry: '+uses.slice(0,2).join(', ');
    if(r.offFor&&r.offFor.length){
      const alt=(w.alts||[]).find(a=>a.nights.includes(r.day));
      meta+='   \u00B7   '+r.offFor.join(' & ')+' eats: '+(alt?alt.rec.title:'alternate');
    }
    d.text(M,y+32,d.wrap(meta,CW,9.5)[0],{size:9.5,color:muted});
    d.line(M,y+rowH-26,W-M,y+rowH-26,ln);
    y+=rowH;

    d.text(M,y,'INGREDIENTS',{size:11,bold:true,color:ink}); y+=17;
    (r.ingredients||[]).forEach(x=>{
      if(y>BOT){ d.addPage(); y=64; }
      d.text(M+4,y,'\u00B7   '+round2(x.qty)+' '+x.unit+'   '+x.name,{size:11,color:ink}); y+=16;
    });
    y+=16;
    d.text(M,y,'DIRECTIONS',{size:11,bold:true,color:ink}); y+=18;
    if(r.steps&&r.steps.length){
      r.steps.forEach((s,ix)=>{
        const lines=d.wrap((ix+1)+'.   '+s,CW-8,11);

        lines.forEach(l=>{ d.text(M+4,y,l,{size:11,color:ink}); y+=15; });

      d.wrap('Full directions: '+r.url,CW,10).forEach(l=>{ d.text(M+4,y,l,{size:10,color:muted}); y+=14; });

  /* alternate meal pages */
  (w.alts||[]).forEach(a=>{
    const r=a.rec; d.addPage(); let y=64;
    d.text(M,y,('ALTERNATE \u00B7 '+a.person+' \u00B7 '+a.nights.join(' & ')).toUpperCase(),{size:10,bold:true,color:squash}); y+=22;

    (r.ingredients||[]).forEach(x=>{ if(y>BOT){d.addPage();y=64;} d.text(M+4,y,'\u00B7   '+round2(x.qty)+' '+x.unit+'   '+x.name,{size:11,color:ink}); y+=16; });

}

async function makePDF(){
  if(!S.week){ toast('Plan a week first'); return; }
  let doc;
  try{ doc = buildPDFDoc(); }
  catch(e){ toast('PDF build error: '+e.message); return; }
  const s = doc.output();
  const bytes = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) bytes[i] = s.charCodeAt(i)&0xFF;
  const blob = new Blob([bytes],{type:'application/pdf'});
  const name = 'weekplate-'+S.week.weekOf+'.pdf';
  // 1) native iOS share sheet (Save to Files / Print / AirDrop)
  try{
    const file = new File([blob], name, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name});
      toast('Sent to share sheet'); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  // 2) classic download
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
  }catch(e){}
  // 3) open the in-app preview; if this viewer can't render it either, the bridge is the way
  showPDFViewer(blob, name);
}
function showPDFViewer(blob, name){
  let v = document.getElementById('pdfview');
  if(!v){ v=document.createElement('div'); v.id='pdfview'; document.body.appendChild(v); }
  const url = URL.createObjectURL(blob);
  v.innerHTML = `<div class="pv-bar">
      <span class="pv-name">${esc(name)}</span>
      <button onclick="sharePDFAgain()" id="pvShare">Share</button>
      <button onclick="document.getElementById('pdfview').classList.remove('show')">✕ Close</button>
    </div>
    <iframe src="${url}" title="PDF preview"></iframe>
    <div class="pv-hint">Preview blank? This viewer blocks files. Close this and use "Get PDF via Claude chat" — or run the app from Netlify in Safari where this button saves directly.</div>`;
  v.classList.add('show');
  window._lastPDF = {blob, name};
}
function exportForPDF(){
  const w=S.week; if(!w) return;
  const customsUsed = (S.customRecipes||[]).filter(cr=> w.recipes.some(r=>r.title===cr.t));
  const data = JSON.stringify({v:2, weekOf:w.weekOf, servings:w.servings,
    titles:w.recipes.map(r=>r.title), doubles:w.recipes.filter(r=>r.double).map(r=>r.title),
    pantry:S.pantry, customs:customsUsed});
  $('#sheet').innerHTML = `<div class="sheet-in">
    <div class="sheet-bar"><button onclick="document.getElementById('sheet').classList.remove('show')">✕ Close</button></div>
    <h2 class="disp" style="font-size:19px">Get the PDF through Claude</h2>
    <p class="sub">This app can't save files from inside the Claude app viewer. Copy the plan code below, paste it to Claude in the chat, and ask for the PDF — Claude will attach it as a downloadable file.</p>
    <textarea readonly onclick="this.select()" style="width:100%;height:130px;font:11px ui-monospace,monospace;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)">${esc(data)}</textarea>
    <button class="btn" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousElementSibling.value).then(()=>toast('Copied — paste it to Claude')).catch(()=>toast('Tap the code, Select All, Copy'))">Copy plan code</button>
  </div>`;
  $('#sheet').classList.add('show'); $('#sheet').scrollTop=0;
}
async function sharePDFAgain(){
  const p = window._lastPDF; if(!p) return;
  try{
    const file = new File([p.blob], p.name, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:p.name}); return; }
  }catch(e){}
  toast('Share not available in this viewer');
}

/* print fallback: browser print dialog -> Save as PDF */
function printFallback(){
  const w=S.week; if(!w) return;
  let pv = document.getElementById('printview');
  if(!pv){ pv=document.createElement('div'); pv.id='printview'; document.body.appendChild(pv); }
  const items=w.shopping.filter(i=>!i.pantryOnly);
  pv.innerHTML = `
    <h1>WeekPlate — Week of ${w.weekOf} (${w.servings} servings/dinner)</h1>
    <table>${w.recipes.map(r=>`<tr><td><b>${esc(r.day)}</b></td><td>${esc(r.title)}</td><td>${(r.prepMin||0)+(r.cookMin||0)} min</td></tr>`).join('')}</table>
    ${w.recipes.map(r=>`<div class="pbreak">
      <h2>${esc(r.day)}: ${esc(r.title)}</h2>
      <p>Prep ~${r.prepMin} min · Cook ~${r.cookMin} min · Serves ${w.servings}</p>
      <h3>Ingredients</h3><ul>${(r.ingredients||[]).map(x=>`<li>${round2(x.qty)} ${esc(x.unit)} ${esc(x.name)}</li>`).join('')}</ul>
      <h3>Directions</h3><ol>${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    </div>`).join('')}
    <div class="pbreak"><h2>Shopping list</h2>
      <ul>${items.map(it=>`<li>☐ ${esc(it.name)} — ${it.packs}× ${esc(it.pkg||'')} (${money((it.walmart||0)*it.packs)} W / ${money((it.aldi||0)*it.packs)} A)</li>`).join('')}</ul></div>`;
  if(typeof window.print==='function'){ setTimeout(()=>window.print(),100); toast('Use the print dialog → Save as PDF'); }

}

/* share / copy the shopping list as plain text */
function shareList(){
  const w=S.week; if(!w) return;
  const items=w.shopping.filter(i=>!i.pantryOnly);
  const tW=items.reduce((s,i)=>s+(i.walmart!=null?i.walmart*i.packs:0),0);
  const tA=items.reduce((s,i)=>s+(i.aldi!=null?i.aldi*i.packs:0),0);
  const st=shopStore(); const lbl={}; aisleOrderFor(st).forEach(([c,l])=>lbl[c]=l);
  let txt='WeekPlate shopping — week of '+w.weekOf+' ('+(st==='aldi'?'Aldi':'Walmart')+' aisle order)\n';
  let cat='';
  sortByAisle(items, st).forEach(it=>{
    if(it.category!==cat){ cat=it.category; txt+='\n'+(lbl[cat]||cat).toUpperCase()+'\n'; }
    txt+='- '+it.name+' ('+it.packs+'x '+(it.pkg||'')+')\n';
  });
  txt+='\nWalmart '+money(tW)+' | Aldi '+money(tA);
  if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>toast('List copied')).catch(()=>toast('Could not copy')); }
  else toast('Sharing not available here');
}

function nutFor(name){ return NUT[normName(name)] || NUT[name] || null; }
function recipeNutrition(rec){ // per serving, from scaled ingredients
  let c=0,p=0,b=0,f=0, servings=rec.servings||4;
  (rec.ingredients||[]).forEach(x=>{ const n=nutFor(x.name); if(n){ c+=n.c*x.qty; p+=(n.p||0)*x.qty; b+=(n.b||0)*x.qty; f+=(n.f||0)*x.qty; } });
  return { cal:Math.round(c/servings), protein:Math.round(p/servings), carbs:Math.round(b/servings), fat:Math.round(f/servings) };
}
function unitPriceOf(name){ // best-of-store $ per one unit, honoring receipt overrides
  const key=normName(name);
  const base=PRICES[name]||PRICES[key];
  const ov=(S.priceBook||{})[key];
  let per=null;
  if(base){ const m=Math.min(base.w??Infinity, base.a??Infinity); if(isFinite(m)) per=m/base.q; }
  if(ov&&ov.pkgQty){ const m=Math.min(ov.walmart??Infinity, ov.aldi??Infinity); if(isFinite(m)) per=m/ov.pkgQty; }
  return per;
}
const _cost4Cache={};
function recipeCost4(src){ // marginal cost of the recipe at 4 servings
  if(_cost4Cache[src.t]!=null) return _cost4Cache[src.t];
  let c=0;
  src.ing.forEach(([nm,q])=>{ const per=unitPriceOf(nm); if(per!=null) c+=per*q; });
  _cost4Cache[src.t]=c; return c;
}
function clearCostCache(){ for(const k in _cost4Cache) delete _cost4Cache[k]; }
const _nut4Cache={};
function recipeNut4(src){ // per-serving macros at base scale
  if(_nut4Cache[src.t]) return _nut4Cache[src.t];
  let c=0,p=0,b=0,f=0;
  src.ing.forEach(([nm,q])=>{ const n=nutFor(nm); if(n){ c+=n.c*q; p+=(n.p||0)*q; b+=(n.b||0)*q; f+=(n.f||0)*q; } });
  return _nut4Cache[src.t]={cal:c/4, protein:p/4, carbs:b/4, fat:f/4};
}
function clearNutCache(){ for(const k in _nut4Cache) delete _nut4Cache[k]; }
function macroOK(src, tol){ // per-dinner mode check with tolerance multiplier
  const m=S.macro||{}; if(m.mode!=='day') return true;
  const n=recipeNut4(src); tol=tol||1;
  if(m.cal>0 && n.cal > m.cal*tol) return false;
  if(m.protein>0 && n.protein < m.protein/tol) return false;
  if(m.carbs>0 && n.carbs > m.carbs*tol) return false;
  if(m.fat>0 && n.fat > m.fat*tol) return false;
  return true;
}

};
function aisleOrderFor(store){
  return AISLES[store] || AISLES.walmart;
}
function sortByAisle(items, store){
  const order = aisleOrderFor(store);
  const catIdx = {}; order.forEach(([c],i)=>catIdx[c]=i);
  return items.slice().sort((a,b)=>{
    const ca=catIdx[a.category]??99, cb=catIdx[b.category]??99;
    if(ca!==cb) return ca-cb;
    const sub=SUB[a.category];
    if(sub){
      const ia=sub.indexOf(normName(a.name)), ib=sub.indexOf(normName(b.name));
      if(ia!==ib) return (ia<0?999:ia)-(ib<0?999:ib);
    }
    return a.name.localeCompare(b.name);
  });
}

/* ================= receipt scanning ================= */
const KNOWN_NAMES = Object.keys(PRICES); // library ingredient names for matching
// common receipt abbreviations / brand noise -> canonical words
const ABBR = {chkn:'chicken',ckn:'chicken',brst:'breast',bnls:'boneless',bnlss:'boneless',
  gv:'',greatvalue:'',great:'',value:'',gr:'',lg:'',sm:'',med:'',org:'',orgnc:'organic',
  bf:'beef',grnd:'ground',gnd:'ground',pk:'pork',trky:'turkey',veg:'vegetable',
  chs:'cheese',chz:'cheese',mozz:'mozzarella',parm:'parmesan',ched:'cheddar',
  tom:'tomato',pot:'potato',ban:'banana',avo:'avocado',
  ss:'',pkg:'',ea:'',lb:'',oz:'',ct:'',jar:'',can:'',bag:'',box:'',bnch:'bunch'};
function cleanTokens(raw){
  return normName(raw.replace(/\d+\s*(oz|lb|ct|gal|pk|pack|count)/gi,' '))
    .split(' ')
    .map(w=>ABBR[w]!==undefined?ABBR[w]:w)
    .filter(w=>w.length>1);
}
function stem(w){ return w.replace(/(es|s)$/,''); }
function matchIngredient(raw){
  const s = normName(raw);
  if(!s) return null;
  if(PRICES[s]) return s;
  const toks = cleanTokens(raw);
  if(!toks.length) return null;
  const joined = toks.join(' ');
  if(PRICES[joined]) return joined;
  let best=null, bs=0;
  KNOWN_NAMES.forEach(k=>{
    const kt = k.split(' ');
    let hit=0;
    toks.forEach(t=>{ const ts=stem(t);
      if(kt.some(w=>{const ws=stem(w); return ws===ts||ws.includes(ts)||ts.includes(ws);})) hit++;
    });
    // reward matching the key's main (last) word — the noun
    const noun = stem(kt[kt.length-1]);
    const nounExact = toks.some(t=>stem(t)===noun);
    const nounHit = nounExact ? 0.34 : 0;
    let score = hit/Math.max(1,Math.max(toks.length,kt.length)) + nounHit;
    // single-token fuzzy matches (no exact noun, only 1 hit) are unreliable — discount hard
    if(!nounExact && hit<2) score *= 0.4;
    if(score>bs){ bs=score; best=k; }
  });
  return bs>=0.6 ? best : null;
}
function parseReceiptText(txt){
  // find "ITEM ..... 3.98" style lines; grab trailing price
  const out=[];
  txt.split(/\n+/).forEach(lineRaw=>{
    const line = lineRaw.trim();
    if(!line || line.length<3) return;
    if(/subtotal|total|tax|change|balance|debit|credit|cash|tender|savings|items sold|thank/i.test(line)) return;
    const m = line.match(/(.+?)[\s\.\-]*\$?\s*(\d{1,3}\.\d{2})\s*[A-Z]?$/);
    if(!m) return;
    const name = m[1].replace(/\s{2,}/g,' ').replace(/[^A-Za-z0-9 %&.\-]/g,'').trim();
    const price = parseFloat(m[2]);
    if(name.length<2 || price<=0 || price>200) return;
    out.push({ raw:name, price, match:matchIngredient(name) });
  });
  return out;
}

let ocrBusy=false;
async function scanReceipt(file, store){
  if(ocrBusy) return;
  ocrBusy=true;
  showScanProgress('Reading receipt…', 'Loading OCR engine (first time may take a moment)…');
  try{
    // try Tesseract.js (offline, works in-app)
    let text=null;
    try{
      await loadTesseract();
      const dataUrl = await fileToDataURL(file);
      updateScan('Recognizing text…','This runs entirely on your phone.');
      const res = await window.Tesseract.recognize(dataUrl, 'eng', {
        logger:m=>{ if(m.status==='recognizing text') updateScan('Recognizing text…', Math.round(m.progress*100)+'%'); }
      });
      text = res.data.text;
    }catch(e){ text=null; }
    if(!text || !text.trim()){ hideScan(); toast('Could not read the image — try a clearer, flatter photo'); ocrBusy=false; return; }
    const items = parseReceiptText(text);
    hideScan();
    if(!items.length){ toast('No price lines found — try a sharper photo'); ocrBusy=false; return; }
    openReceiptReview(items, store, text);
  }catch(e){ hideScan(); toast('Scan failed: '+e.message); }
  ocrBusy=false;
}
function loadTesseract(){
  return new Promise((res,rej)=>{
    if(window.Tesseract) return res();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('offline OCR unavailable here'));
    document.head.appendChild(s);
    setTimeout(()=>rej(new Error('OCR load timeout')),15000);
  });
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('read failed')); r.readAsDataURL(file); });
}

function guessUnit(match){ const p=match&&PRICES[normName(match)]; return p?p.u:''; }
function saveReceipt(){
  const {items, store} = reviewData;
  let saved=0;
  items.forEach(it=>{
    if(it.skip) return;
    const key = normName(it.match||it.raw);
    if(!key || !(it.price>0)) return;
    const unit = (it.unit||guessUnit(it.match)||'count').trim();
    const pkgQty = it.pkgQty || (PRICES[key]?PRICES[key].q:1);
    const rec = S.priceBook[key] || {unit, pkg:'', pkgQty, walmart:null, aldi:null};
    rec.unit=unit; rec.pkgQty=pkgQty; if(!rec.pkg) rec.pkg=it.pkgQty? (pkgQty+' '+unit):'receipt';
    if(store==='walmart') rec.walmart=round2(it.price); else rec.aldi=round2(it.price);
    rec.ts=Date.now();
    S.priceBook[key]=rec; saved++; clearCostCache();
  });
  save();
  $('#sheet').classList.remove('show');
  if(S.week){ libPrice(S.week.shopping); save(); }
  toast(`Saved ${saved} ${store} price${saved!==1?'s':''}`);
  render();
}

/* ================= share plan across devices ================= */
/* Encodes the plan into a link. No server: everything travels in the URL. */
function b64urlEncode(str){
  const bytes = new TextEncoder().encode(str);
  let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
async function deflate(str){
  try{
    if(!window.CompressionStream) return null;
    const cs = new CompressionStream('deflate-raw');
    const blob = new Blob([new TextEncoder().encode(str)]);
    const ab = await new Response(blob.stream().pipeThrough(cs)).arrayBuffer();
    let bin=''; new Uint8Array(ab).forEach(b=>bin+=String.fromCharCode(b));
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }catch(e){ return null; }
}
async function inflate(s){
  try{
    if(!window.DecompressionStream) return null;
    s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
    const bin=atob(s); const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const ds = new DecompressionStream('deflate-raw');
    const ab = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    return new TextDecoder().decode(new Uint8Array(ab));
  }catch(e){ return null; }
}

/* payload: enough to rebuild the exact same plan + list on another device */
function buildSharePayload(){

  const customsUsed=(S.customRecipes||[]).filter(cr=>
    w.recipes.some(r=>r.title===cr.t) || (w.alts||[]).some(a=>a.rec.title===cr.t));
  return {
    v:3, weekOf:w.weekOf, servings:w.servings, horizon:w.horizon||1,
    // one entry per cooked recipe: title, day, week, servings, double flag, locked
    r: w.recipes.map(r=>[r.title, r.day, r.week||1, r.servings||w.servings, r.double?1:0]),
    // alternates: person, title, nights, servings
    a: (w.alts||[]).map(x=>[x.person, x.rec.title, x.nights, x.rec.altServes]),
    // the pantry that was subtracted, so her shopping list matches yours exactly
    pn: (w.shopping||[]).filter(i=>i.fromPantry>0).map(i=>[i.name,i.fromPantry,i.unit]),
    pb: S.priceBook||{},          // so her prices match yours
    cx: customsUsed,              // custom recipes used this week
    hh: S.household.map(p=>({name:p.name,age:p.age,diet:p.diet||[]})),
    // photos deliberately excluded: they'd make the link enormous
    from: (S.household[0]&&S.household[0].name)||''
  };
}

  try{ json = m[1]==='z' ? await inflate(m[2]) : b64urlDecode(m[2]); }catch(e){ json=null; }
